intro: "Anne Fleck, bekannt als Doc Fleck, ist Internistin, Rheumatologin und Ernährungsmedizinerin mit Privatpraxis in Hamburg-Nienstedten. Seit dem Sendestart 2014 gehört sie zum festen Trio der NDR-Ernährungs-Docs — und hat mit Büchern wie dem SPIEGEL-Bestseller «Ran an das Fett» eine der reichweitenstärksten Stimmen der deutschen Präventionsmedizin aufgebaut."
