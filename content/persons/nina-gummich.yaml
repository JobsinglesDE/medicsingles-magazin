faqItems:
  - question: Wer ist Nina Gummich?
    answer: "Nina Gummich ist eine deutsche Schauspielerin, geboren am 24. September 1991 in Halle (Saale). Sie stammt aus einer Theaterfamilie — ihre Mutter Anne-Kathrin Gummich ist Professorin für Schauspiel an der HMT Leipzig. Bekannt wurde Nina Gummich durch die Hauptrolle als Dr. Ella Wendt in der dritten Staffel von «Charité» (ARD, 2021) sowie als Theresa Wolff im ZDF-Thüringenkrimi."
  - question: Welche Rolle spielt Nina Gummich in Charité?
    answer: "In der dritten Staffel von «Charité», die im Januar 2021 in der ARD ausgestrahlt wurde und im geteilten Berlin des Jahres 1961 spielt, übernahm Nina Gummich die Staffelhauptrolle als Dr. Ella Wendt — eine junge Ärztin im Ost-West-Konflikt kurz vor dem Mauerbau. Es war ihre erste große Serienhauptrolle im deutschen Fernsehen."
  - question: Woher stammt Nina Gummich?
    answer: "Nina Gummich wurde am 24. September 1991 in Halle (Saale) geboren und wuchs in Leipzig auf. Sie stammt aus einer Schauspielerfamilie: Ihre Mutter Anne-Kathrin Gummich ist Schauspieldozentin, Regisseurin und Professorin an der Hochschule für Musik und Theater «Felix Mendelssohn Bartholdy» in Leipzig."
  - question: Was spielte Nina Gummich nach Charité?
    answer: "Nach «Charité» übernahm Nina Gummich ab Oktober 2021 die Titelrolle der Rechtsmedizinerin Theresa Wolff im ZDF-Krimi «Theresa Wolff – Der Thüringenkrimi». 2022 folgte das ZDF-Drama «So laut du kannst» sowie der vielbeachtete ARD-Zweiteiler «Alice», in dem sie die junge Alice Schwarzer verkörperte und für ihre Darstellung hoch gelobt wurde."
  - question: Wie alt ist Nina Gummich?
    answer: "Nina Gummich wurde am 24. September 1991 geboren. Im Jahr 2026 ist sie 34 Jahre alt."
takeaways:
  - "Nina Gummich, geboren 1991 in Halle, wuchs in einer Theaterfamilie auf — ihre Mutter lehrt Schauspiel als Professorin an der HMT Leipzig. Diese Herkunft prägt ihre Arbeit: technisch präzise, nie auf Effekte hin gespielt."
  - "In der dritten Staffel von «Charité» (ARD, 2021) übernahm sie die Hauptrolle als Dr. Ella Wendt und wurde damit von einer Theaterschauspielerin zur gefragten TV-Darstellerin — ein Karriereschritt, der sitzt."
  - "Heute trägt sie gleich zwei wiederkehrende Rollen: als Rechtsmedizinerin Theresa Wolff im Thüringenkrimi und hat mit dem Alice-Schwarzer-Zweiteiler gezeigt, dass sie auch biografisch komplexe Porträts trägt."
