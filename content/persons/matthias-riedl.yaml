intro: "Matthias Riedl ist Internist, Diabetologe und der bekannteste Ernährungs-Doc im deutschen Fernsehen. Seit 2014 ist er als E-Doc der NDR-Sendung Die Ernährungs-Docs einem Millionenpublikum bekannt — und zeigt, dass Ernährung echte Medizin sein kann. Im echten Leben steht hinter dem TV-Gesicht der Gründer eines der größten interdisziplinären Versorgungszentren Europas."
