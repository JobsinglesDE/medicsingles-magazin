intro: "Marijam Agischewa spielt seit Januar 2015 die Chefärztin Prof. Dr. Karin Patzelt in «In aller Freundschaft – Die jungen Ärzte». Geboren 1958 in Hangzhou, China, aufgewachsen in der DDR — ihre Biografie reicht von der DEFA über die Ernst-Busch-Schauspielschule bis zum Stamm-Cast der ARD-Erfolgsserie. Privat lebt sie als Heilpraktikerin für Psychotherapie in Berlin."
