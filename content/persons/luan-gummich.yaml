faqItems:
  - question: Wer ist Luan Gummich?
    answer: "Luan Gummich ist ein deutscher Schauspieler, geboren am 16. Mai 1989 in Köln. Er ist vor allem bekannt als Dr. Mikko Rantala in der ARD-Serie «In aller Freundschaft – Die jungen Ärzte», in der er seit 2018 mitspielt. Sein bürgerlicher Name ist Sven Luan Gummich — den Vornamen Luan hat er von seiner brasilianischen Mutter."
  - question: Welche Rolle spielt Luan Gummich in Die jungen Ärzte?
    answer: "Luan Gummich spielt Dr. Mikko Rantala, einen finnischstämmigen Arzt am Johannes-Thal-Klinikum in Erfurt. Die Figur startete 2018 als ruhiger Assistenzarzt und entwickelte sich über die Staffeln zum Facharzt mit ausgeprägtem moralischem Kompass. Bis 2025 hat Gummich bereits fast 200 Episoden abgedreht."
  - question: Woher kommt der Name Luan Gummich?
    answer: "Luan Gummichs vollständiger Name ist Sven Luan Gummich. Den zweiten Vornamen Luan trägt er nach seiner Mutter, die aus Brasilien stammt. Beruflich verwendet er ausschließlich den Namen Luan. Die brasilianischen Wurzeln sind ihm wichtig — er besucht Brasilien regelmäßig und hat enge familiäre Verbindungen dorthin."
  - question: Hat Luan Gummich eine Partnerin?
    answer: "Über sein Liebesleben äußert sich Luan Gummich öffentlich nicht. Auf seinem Instagram-Profil (@luangummich) gibt es keine Hinweise auf eine feste Beziehung. Ob er in einer Partnerschaft lebt, ist nicht bekannt — er hält diesen Teil seines Lebens konsequent aus der Öffentlichkeit heraus."
  - question: Was machte Luan Gummich vor der Schauspielerei?
    answer: "Vor seiner Ausbildung an der Schauspielschule der Keller in Köln (2010–2014) leistete Luan Gummich Zivildienst in einem Kinderheim — unter anderem in Brasilien und Peru. Diese Zeit hat ihn nach eigener Aussage nachhaltig geprägt und seinen Weg zur Schauspielerei beschleunigt."
  - question: Wie kam Luan Gummich zur Rolle des Mikko Rantala?
    answer: "Ursprünglich sollte Luan Gummich für die Rolle Tom Zondek vorsprechen. Die Casting-Direktion sah ihn jedoch besser als Mikko Rantala — einem schweigsamen Finnen. Gummich selbst nennt das eine «typische Fehlbesetzung»: ein brasilianisch geprägter Kölner spielt den introvertierten Nordeuropäer. Als er die Zusage bekam, weinte er."
takeaways:
  - "Luan Gummich, bürgerlich Sven Luan Gummich, wurde 1989 in Köln geboren und hat deutsch-brasilianische Wurzeln. Sein Vorname Luan stammt von seiner brasilianischen Mutter — Südamerika ist für ihn keine Herkunfts-Fußnote, sondern ein echtes Kapitel seines Lebens."
  - "Seit 2018 verkörpert er Dr. Mikko Rantala in «Die jungen Ärzte» — fast 200 Episoden, in denen er den stillen Finnen gegen seinen eigenen lebhaften Charakter spielt: Mikko schweigt, Luan redet."
  - "Sein Privatleben hält er vollständig aus der Öffentlichkeit: Beziehungsstatus und Liebesleben bleiben unbekannt — eine Haltung, die er nie als Strategie bezeichnete, sondern schlicht lebt."
