intro: "Prof. Dr. Dietrich Grönemeyer ist einer der bekanntesten Ärzte Deutschlands — Radiologe, Rückenmediziner und Bestseller-Autor. Als Bruder von Rockstar Herbert Grönemeyer wurde er einer breiten Öffentlichkeit bekannt, doch sein Ruf als Mediziner gründet auf fast 40 Jahren Arbeit rund um Rückenerkrankungen. Mit seinem 2025 erschienenen Buch «Demenz» öffnete er sich erstmals sehr persönlich: Beide Elternteile erkrankten an Demenz — eine Erfahrung, die seinen Blick auf Medizin und Menschlichkeit grundlegend veränderte."
