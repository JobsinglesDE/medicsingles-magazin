intro: "Harry Shum Jr. ist Tänzer, Schauspieler und seit Staffel 19 als Dr. Benson «Blue» Kwan festes Mitglied von «Grey's Anatomy». Bekannt wurde er als Mike Chang in «Glee» und als Waymond Wang in dem Oscar-Gewinner «Everything Everywhere All at Once» — ein Multitalent, das zwischen Hip-Hop, Drama und Action wechselt wie andere die Kostüme."
