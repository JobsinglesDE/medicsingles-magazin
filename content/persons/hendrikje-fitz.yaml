faqItems:
  - question: Wer war Hendrikje Fitz?
    answer: "Hendrikje Fitz (1961–2016) war eine deutsche Schauspielerin, bekannt durch ihre langjährige Rolle als Physiotherapeutin Pia Heilmann in der ARD-Arztserie «In aller Freundschaft». Sie entstammte der Berliner Schauspielerfamilie Fitz und war von 1981 an auf Theaterbühnen in ganz Deutschland aktiv."
  - question: Welche Rolle spielte Hendrikje Fitz in «In aller Freundschaft»?
    answer: "Hendrikje Fitz spielte ab 1998 die Physiotherapeutin Pia Heilmann — Ehefrau von Chefarzt Dr. Roland Heilmann (Thomas Rühmann). Pia war eine der Hauptfiguren der Serie und stand bis zu Fitz' Tod 2016 im Mittelpunkt zahlreicher Handlungsstränge."
  - question: Woran ist Hendrikje Fitz gestorben?
    answer: "Hendrikje Fitz starb am 7. April 2016 im Alter von 54 Jahren an den Folgen einer Brustkrebserkrankung. Die Diagnose hatte sie im August 2014 erhalten; nach einem vorübergehenden Rückgang der Erkrankung kam es im Herbst 2015 zu einem unheilbaren Rückfall."
  - question: Hatte Hendrikje Fitz Kinder?
    answer: "Hendrikje Fitz hinterließ eine Tochter. Über ihr Privatleben sprach sie stets sehr zurückhaltend und hielt die Familie konsequent aus der Öffentlichkeit heraus."
  - question: Wie erinnert «In aller Freundschaft» an Hendrikje Fitz?
    answer: "Die Serie ehrte Hendrikje Fitz nach ihrem Tod mit einer bewegenden Abschiedsfolge, in der die Figur der Pia Heilmann würdevoll verabschiedet wurde. Zum 10. Todestag im April 2026 widmete ihr die Produktion erneut einen besonderen Beitrag."
takeaways:
  - "Hendrikje Fitz prägte «In aller Freundschaft» über fast zwei Jahrzehnte als Pia Heilmann — ihre warmherzige Darstellung machte sie zu einer der meistgeliebten Figuren der ARD-Arztserie."
  - "Ihren Kampf gegen den Brustkrebs trug sie mit großer Würde; ihr offener Umgang mit der Erkrankung hat vielen Betroffenen Mut gemacht und ihr Vermächtnis weit über die Serie hinaus geprägt."
  - "Als Kind einer Schauspielerfamilie stand sie von Anfang an für Theaterhandwerk und Authentizität — Qualitäten, die Pia Heilmann zu einer unvergesslichen Figur machten."
