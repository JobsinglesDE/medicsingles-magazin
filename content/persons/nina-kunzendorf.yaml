faqItems:
  - question: Wer ist Nina Kunzendorf?
    answer: "Nina Kunzendorf ist eine deutsche Schauspielerin, geboren am 10. November 1971 in Mannheim. Sie absolvierte ihre Ausbildung an der Ernst-Busch-Hochschule für Schauspielkunst in Berlin und ist vor allem durch ihre Rolle als Tatort-Kommissarin Conny Mey und durch die ARD-Historieserie «Charité» bekannt."
  - question: Welche Rolle spielt Nina Kunzendorf in «Charité»?
    answer: "In der dritten Staffel von «Charité» (ARD/MDR, 2021) spielt Nina Kunzendorf die Ärztin Dr. Ingeborg Rapoport. Die Handlung ist im Berlin der frühen 1960er-Jahre angesiedelt. Das historische Vorbild, die jüdisch-deutsch-amerikanische Neonatologin Ingeborg Rapoport (1912–2017), wurde 1938 von den Nationalsozialisten an ihrer Doktorarbeit gehindert und verteidigte diese erst 2015 im Alter von 102 Jahren erfolgreich."
  - question: Warum ist die historische Ingeborg Rapoport medizinhistorisch bedeutsam?
    answer: "Ingeborg Rapoport gilt als eine der Pionierinnen der modernen Neonatologie. Sie wurde 1938 in Hamburg von den Nazis aufgrund ihrer jüdischen Herkunft an der mündlichen Doktorprüfung gehindert. Erst 2015 — im Alter von 102 Jahren — durfte sie ihre Dissertation an der Universität Hamburg offiziell verteidigen. Ihr Fall machte weltweit Schlagzeilen und wurde zum Symbol für späte Gerechtigkeit."
  - question: Was ist der Tatort Frankfurt und welche Rolle spielte Nina Kunzendorf darin?
    answer: "Der Tatort Frankfurt ist das Ermittlerformat des Hessischen Rundfunks. Nina Kunzendorf spielte von 2011 bis 2013 die Kriminalhauptkommissarin Conny Mey — ihren ersten Auftritt hatte sie 2011 in der 800. Tatort-Folge «Eine bessere Welt». Auf eigenen Wunsch verließ sie das Frankfurter Team nach fünf Folgen wieder."
  - question: Hat Nina Kunzendorf Preise gewonnen?
    answer: "Ja. Für ihre Rolle als Conny Mey im Tatort Frankfurt erhielt Nina Kunzendorf 2012 den Grimme-Preis und die Goldene Kamera. Bereits 2009 war sie mit dem Hessischen Fernsehpreis ausgezeichnet worden. Der Grimme-Preis gilt als eine der renommiertesten Auszeichnungen im deutschsprachigen Fernsehen."
takeaways:
  - "Nina Kunzendorf verkörpert in «Charité» Staffel 3 die reale Ärztin Dr. Ingeborg Rapoport — eine Pionierin, die 1938 von den Nazis um ihren Doktortitel gebracht wurde und ihn erst mit 102 Jahren verteidigen durfte. Die Rolle verbindet Medizingeschichte mit dem Unrecht des Nationalsozialismus."
  - "Als Tatort-Kommissarin Conny Mey war Kunzendorf von 2011 bis 2013 fester Bestandteil der deutschen Krimi-Landschaft — das Frankfurter Team stand für Tiefgang statt Action."
  - "Mit dem Grimme-Preis 2012, Theaterarbeit an der Schaubühne und dem Berlinale-Film «Was nützt die Liebe in Gedanken» belegt Kunzendorf, dass sie weit mehr ist als ein TV-Gesicht."
