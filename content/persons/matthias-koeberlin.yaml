faqItems:
  - question: Wer ist Matthias Koeberlin?
    answer: "Matthias Koeberlin ist ein deutscher Filmschauspieler, geboren am 23. November 1970 in Mainz. Er wurde einer breiten Öffentlichkeit bekannt durch die Hauptrolle im ZDF-Zweiteiler «Das Jesus Video» (2002). In der ARD-Historienserie «Charité» spielte er in der ersten Staffel (2017) den Nobelpreisträger Emil von Behring."
  - question: Welche Rolle spielt Matthias Koeberlin in «Charité»?
    answer: "In «Charité» Staffel 1 (ARD, 2017) verkörpert Matthias Koeberlin den Bakteriologen und Mediziner Emil von Behring. Die Handlung spielt im Jahr 1888 — Behring forscht an der Charité in Berlin an einem Serum gegen Diphtherie, das kurz darauf Tausende Kinderleben retten wird. Emil von Behring erhielt 1901 für diese Arbeit den ersten Nobelpreis für Physiologie oder Medizin."
  - question: Was ist «Das Jesus Video» und welche Rolle hat Matthias Koeberlin darin?
    answer: "«Das Jesus Video» ist eine zweiteilige Verfilmung des gleichnamigen Romans von Andreas Eschbach aus dem Jahr 2002 (ZDF/Sat.1). Matthias Koeberlin spielt darin die Hauptrolle des Archäologie-Studenten Stephen Klein, der bei einer Ausgrabung in Israel auf ein 2000 Jahre altes Camcorder-Manual stößt — mit ungeheuerlichen Konsequenzen. Der Zweiteiler war ein Quotenerfolg und machte Koeberlin bundesweit bekannt."
  - question: Wo wurde Matthias Koeberlin ausgebildet?
    answer: "Matthias Koeberlin studierte Schauspiel an der Hochschule für Musik und Theater Hamburg — einer der renommiertesten deutschen Ausbildungsstätten für darstellende Künste. Nach dem Studium arbeitete er sowohl an Bühnen als auch für Film und Fernsehen."
  - question: Hat Matthias Koeberlin soziale Medien?
    answer: "Matthias Koeberlin ist nicht auf Instagram oder anderen öffentlichen Plattformen aktiv. Er hält sein Privat- und Berufsleben weitgehend aus der Öffentlichkeit heraus — Informationen über aktuelle Projekte finden sich in offiziellen Pressemitteilungen und auf seiner Agenturen-Seite."
takeaways:
  - "Matthias Koeberlin, 1970 in Mainz geboren, gehört seit den frühen 2000er-Jahren zu den verlässlichsten deutschen TV-Schauspielern — bekannt durch «Das Jesus Video» (2002) und seine Charité-Rolle als Emil von Behring."
  - "In der ARD-Historienserie «Charité» Staffel 1 gibt er dem Nobelpreisträger Emil von Behring ein Gesicht: dem Forscher, der 1888 an der Charité das Diphtherie-Serum entwickelte und damit die moderne Immunologie begründete."
  - "Koeberlin arbeitet konsequent seriös — kein Social-Media-Auftritt, kein Boulevard — sondern ausschließlich über die Qualität seiner Rollen, von Kinofilmen über Arthouse bis zum ARD-Mehrteiler."
