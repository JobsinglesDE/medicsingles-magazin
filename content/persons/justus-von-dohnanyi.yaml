intro: "Justus von Dohnányi ist als Robert Koch in «Charité» Staffel 1 zu sehen — dem Bakteriologen, der 1888 an der Berliner Universitätsklinik die Tuberkulose bekämpfte. Der Münchner Schauspieler entstammt einer der bedeutendsten Musikerdynastien Deutschlands und hat sich seit den 1990er-Jahren mit Rollen in «Schtonk!», «Männerherzen» und zahlreichen Kinoproduktionen einen festen Platz im deutschen Film- und Fernsehgeschäft erarbeitet."
