intro: "Nina Kunzendorf ist eine der vielseitigsten deutschen Schauspielerinnen ihrer Generation. Einem breiten Publikum wurde sie als Kommissarin Conny Mey im Tatort Frankfurt bekannt, doch ihr Repertoire reicht vom psychologischen Kinofilm bis zur historischen Serienrolle. In der ARD-Historieserie «Charité» verkörperte sie in Staffel 3 die reale Ärztin Dr. Ingeborg Rapoport — eine Pionierin der Neonatologie, die erst mit 102 Jahren ihren Doktortitel verteidigen durfte."
