intro: "Alicia von Rittberg ist die Ida Lenze — jene junge Frau, die in der ARD-Serie «Charité» (Staffel 1, 1888) als Pflegerin an der Berliner Universitätsklinik gegen alle Widerstände Ärztin werden will. Für diese Hauptrolle erhielt die 1993 in München geborene Schauspielerin den Bambi 2017. International kennt man sie als Emma in «Fury» (2014), als Natasha in «Our Kind of Traitor» (2016), als Prinzessin Cecilie in «The Crown» (Staffel 1) und als Elizabeth Tudor in der Starz-Serie «Becoming Elizabeth» (2022)."
