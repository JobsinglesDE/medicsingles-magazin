intro: "Mala Emde gehört zu den aufregendsten Schauspielerinnen ihrer Generation in Deutschland. In Staffel 2 der ARD-Historienserie «Charité» verkörpert sie die junge Ärztin Anni Waldhausen, die 1943 im von der NS-Diktatur kontrollierten Berliner Universitätsklinikum ums Überleben kämpft. Bekannt wurde Emde auch durch ihr Debüt in «303» und die politische Rolle in «Und morgen die ganze Welt» — für Letztere erhielt sie 2021 den Deutschen Filmpreis."
