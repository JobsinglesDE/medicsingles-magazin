faqItems:
  - question: "Was ist Dietrich Grönemeyer für ein Arzt?"
    answer: "Prof. Dr. Dietrich Grönemeyer ist ein deutscher Radiologe und Rückenmediziner. Er gilt seit fast 40 Jahren als einer der bekanntesten Mediziner Deutschlands, ist Bestseller-Autor und TV-Arzt — und der Bruder von Rockstar Herbert Grönemeyer."
  - question: "Welches Buch hat Dietrich Grönemeyer über Demenz geschrieben?"
    answer: "Das Buch heißt «Demenz» und ist 2025 im Penguin Verlag erschienen. Grönemeyer schildert darin persönliche Erfahrungen aus der eigenen Familie und gibt konkrete Tipps zur Vorbeugung sowie zum würdevollen Umgang mit Erkrankten."
  - question: "Wie schläft Dietrich Grönemeyer?"
    answer: "Grönemeyer kommt nach eigenen Angaben mit fünf bis sechs Stunden Schlaf aus. Er zweifelt an pauschalen Schlaf-Empfehlungen und betont: Entscheidend ist, was dem Einzelnen wirklich guttut."
  - question: "Warum hat Dietrich Grönemeyer ein Buch über Demenz geschrieben?"
    answer: "Weil er selbst betroffen war: Beide Elternteile erkrankten an Demenz. Diese persönliche Erfahrung trieb ihn dazu, das Thema öffentlich zu machen und anderen Angehörigen mit konkreten Wegen zur Seite zu stehen."
takeaways:
  - "Grönemeyers Eltern erkrankten beide an Demenz — das veränderte seine Arbeit als Arzt und sein Denken grundlegend."
  - "Sein Buch «Demenz» (Penguin, 2025) zeigt Wege zur Vorbeugung und zu einem liebevollen Umgang mit Erkrankten."
  - "Als Radiologe und Rückenmediziner mit fast 40 Jahren Erfahrung gilt er als einer der bekanntesten Ärzte Deutschlands."
