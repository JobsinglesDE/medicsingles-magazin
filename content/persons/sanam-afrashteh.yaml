faqItems:
  - question: Wer ist Sanam Afrashteh?
    answer: "Sanam Afrashteh ist eine deutsche Schauspielerin mit iranischen Wurzeln. Sie ist seit 2015 als Dr. Leyla Sherbaz in der ARD-Vorabendserie «In aller Freundschaft – Die jungen Ärzte» zu sehen. Seit Staffel 12 spielt sie die Chefärztin am Johannes-Thal-Klinikum in Erfurt."
  - question: Welche Rolle spielt Sanam Afrashteh in Die jungen Ärzte?
    answer: "Sanam Afrashteh spielt Dr. Leyla Sherbaz — seit Staffel 12 (ab 30. April 2026) die Chefärztin am Johannes-Thal-Klinikum in Erfurt. Zuvor war sie über elf Staffeln lang als stellvertretende Chefärztin dabei."
  - question: Hat Sanam Afrashteh Kinder?
    answer: "Ja. Sanam Afrashteh hat eine Tochter, die 2014 geboren wurde. Mehr Details zu ihrer Familie gibt sie nicht preis — die Schauspielerin trennt konsequent zwischen Privat- und Berufsleben."
  - question: Warum machte Sanam Afrashteh eine Pause von Die jungen Ärzte?
    answer: "Der genaue Grund ist nicht bekannt. Afrashteh erklärte auf Instagram, sie habe ihre Kraft, Gedanken und Zeit für sich und ihr Umfeld gebraucht. Nach fast zwei Jahren Drehpause kehrte sie zurück und übernahm in Staffel 12 die Chefarztstelle."
  - question: Seit wann spielt Sanam Afrashteh in Die jungen Ärzte?
    answer: "Sanam Afrashteh gehört seit der ersten Staffel im Jahr 2015 zur Stammbesetzung. In Staffel 12, die am 30. April 2026 startete, wurde ihre Figur zur Chefärztin befördert — die bislang größte Rolle in ihrer Zeit bei der Serie."
  - question: Wann läuft Die jungen Ärzte mit Sanam Afrashteh?
    answer: "«In aller Freundschaft – Die jungen Ärzte» läuft jeden Donnerstag um 18:50 Uhr im Ersten. Die Folgen stehen danach auch in der ARD Mediathek zur Verfügung."
takeaways:
  - "Sanam Afrashteh spielt Dr. Leyla Sherbaz seit 2015 — und ist seit Staffel 12 (April 2026) die neue Chefärztin am Johannes-Thal-Klinikum in Erfurt."
  - "Nach fast zwei Jahren Drehpause kam sie zurück und übernahm die größte Rolle ihrer Serienkarriere — ein Comeback, das sich die Fans gewünscht hatten."
  - "Privat ist sie Mutter einer 2014 geborenen Tochter, lebt in Berlin und hält ihr Privatleben konsequent aus der Öffentlichkeit heraus."
