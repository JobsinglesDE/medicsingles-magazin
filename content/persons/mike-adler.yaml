faqItems:
  - question: Seit wann spielt Mike Adler in «Die jungen Ärzte»?
    answer: "Mike Adler spielt seit 2015 Dr. Matteo Moreau in «In aller Freundschaft – Die jungen Ärzte». Seine Figur ist Oberarzt für Plastische Chirurgie am fiktiven Johannes-Thal-Klinikum in Erfurt. In Staffel 12 (seit 30. April 2026) gerät Moreau in neue Konflikte mit Wolfgang Berger."
  - question: Wer ist Mike Fiction?
    answer: "Mike Fiction ist das Rap-Pseudonym von Mike Adler. Er ist seit 2001 Mitglied des Berliner Kollektivs KaosLoge (Tempeltainment Label). 2007 erschien sein Debüt-Album «Dreckiges Deutsch». Seit 2011 kuratiert er die Musikprogrammierung beim Battle-Format «Rap am Mittwoch» auf Aggro TV."
  - question: Wo wurde Mike Adler geboren und woher kommt er?
    answer: "Mike Adler wurde am 20. März 1978 in West-Berlin geboren. Sein Vater war Nigerianer, seine Mutter Deutsche. Er lebt und arbeitet bis heute in Berlin, die Dreharbeiten für «Die jungen Ärzte» finden in Leipzig statt."
  - question: Hat Mike Adler eine Ehefrau oder Kinder?
    answer: "Eine Ehefrau oder Lebenspartnerin von Mike Adler ist nicht öffentlich bekannt. Kinder sind ebenfalls nicht belegt. Der Schauspieler schützt sein Privatleben konsequent und unterhält keinen privaten Social-Media-Account."
  - question: Wo hat Mike Adler Schauspiel studiert?
    answer: "Mike Adler absolvierte seine Schauspielausbildung von 2003 bis 2006 an der Filmuniversität Babelsberg Konrad Wolf. Schon vor dem Studium war er als Rapper Mike Fiction aktiv — das Rap-Kollektiv KaosLoge gründete er 2001."
takeaways:
  - "Mike Adler spielt seit 2015 Dr. Matteo Moreau in «In aller Freundschaft – Die jungen Ärzte» und ist eine der bekanntesten Figuren der ARD-Erfolgsserie."
  - "Als Rapper Mike Fiction ist er seit 2001 Mitglied des Berliner Kollektivs KaosLoge — Rap war sein erstes Standbein, nicht die Schauspielerei."
  - "Privat bleibt Mike Adler bewusst unsichtbar: keine bestätigte Beziehung, keine Kinder, kein privater Social-Media-Account — eine Seltenheit für einen ARD-Serienstar."
