faqItems:
  - question: Wer ist Nina Kunzendorf?
    answer: "Nina Kunzendorf ist eine deutsche Schauspielerin, geboren am 1. Oktober 1972 in Lemgo. Sie absolvierte ihre Ausbildung an der Ernst-Busch-Hochschule für Schauspielkunst in Berlin und ist heute vor allem durch ihre Rolle als Tatort-Kommissarin Anna Janneke und durch die ARD-Historieserie «Charité» bekannt."
  - question: Welche Rolle spielt Nina Kunzendorf in «Charité»?
    answer: "In der dritten Staffel von «Charité» (ARD/MDR, 2021) spielt Nina Kunzendorf die Ärztin Dr. Ingeborg Rapoport. Die Handlung ist im Berlin der frühen 1960er-Jahre angesiedelt. Das historische Vorbild, die jüdisch-deutsch-amerikanische Neonatologin Ingeborg Rapoport (1912–2017), wurde 1938 von den Nationalsozialisten an ihrer Doktorarbeit gehindert und verteidigte diese erst 2015 im Alter von 102 Jahren erfolgreich."
  - question: Warum ist die historische Ingeborg Rapoport medizinhistorisch bedeutsam?
    answer: "Ingeborg Rapoport gilt als eine der Pionierinnen der modernen Neonatologie. Sie wurde 1938 in Hamburg von den Nazis aufgrund ihrer jüdischen Herkunft an der mündlichen Doktorprüfung gehindert. Erst 2015 — im Alter von 102 Jahren — durfte sie ihre Dissertation an der Universität Hamburg offiziell verteidigen. Ihr Fall machte weltweit Schlagzeilen und wurde zum Symbol für späte Gerechtigkeit."
  - question: Was ist der Tatort Frankfurt und welche Rolle spielt Nina Kunzendorf darin?
    answer: "Der Tatort Frankfurt ist das Ermittlerduo des Hessischen Rundfunks. Nina Kunzendorf spielt seit 2014 neben Wolfram Koch die Kriminalhauptkommissarin Anna Janneke. Das Frankfurter Tatort-Team gilt als eines der psychologisch anspruchsvollsten Ermittlerduos in der ARD-Krimireihe."
  - question: Hat Nina Kunzendorf Preise gewonnen?
    answer: "Ja. Im Jahr 2011 erhielt Nina Kunzendorf den Grimme-Preis Spezial, gemeinsam mit Regisseur Rainer Kaufmann und Kollegin Marie Bäumer. Der Grimme-Preis gilt als eine der renommiertesten Auszeichnungen im deutschsprachigen Fernsehen."
takeaways:
  - "Nina Kunzendorf verkörpert in «Charité» Staffel 3 die reale Ärztin Dr. Ingeborg Rapoport — eine Pionierin, die 1938 von den Nazis um ihren Doktortitel gebracht wurde und ihn erst mit 102 Jahren verteidigen durfte. Die Rolle verbindet Medizingeschichte mit dem Unrecht des Nationalsozialismus."
  - "Als Tatort-Kommissarin Anna Janneke ist Kunzendorf seit 2014 fester Bestandteil der deutschen Krimi-Landschaft — das Frankfurter Team steht für Tiefgang statt Action."
  - "Mit dem Grimme-Preis 2011, Theaterarbeit an der Schaubühne und dem Berlinale-Film «Was nützt die Liebe in Gedanken» belegt Kunzendorf, dass sie weit mehr ist als ein TV-Gesicht."
