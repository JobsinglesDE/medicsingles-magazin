intro: "Matthias Koeberlin ist seit den 1990er-Jahren einer der vielseitigsten deutschen Filmschauspieler. Einem breiten Publikum bekannt wurde er als Hauptdarsteller im Bibel-Thriller «Das Jesus Video» (2002). In der ARD-Historienserie «Charité» verkörperte er in Staffel 1 den Nobelpreisträger Emil von Behring — den Mann, der Ende des 19. Jahrhunderts mit dem Diphtherieserum Tausende Kinderleben rettete. Der 1970 in Mainz geborene Schauspieler ist für seine intensive, präzise Verkörperung historischer wie moderner Charaktere bekannt."
