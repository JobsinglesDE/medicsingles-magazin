faqItems:
  - question: Wie alt ist Thomas Rühmann?
    answer: "Thomas Rühmann wurde am 11. Mai 1955 in Osterburg (Altmark) geboren. Er ist damit Jahrgang 1955 und im Jahr 2026 71 Jahre alt."
  - question: Seit wann spielt Thomas Rühmann den Dr. Roland Heilmann?
    answer: "Thomas Rühmann spielt Dr. Roland Heilmann seit dem Serienstart von «In aller Freundschaft» am 26. Oktober 1998 — das sind über 27 Jahre und damit eine der längsten Hauptrollen im deutschen Fernsehen."
  - question: Hat Thomas Rühmann Kinder?
    answer: "Ja. Thomas Rühmann hat zwei Töchter aus seiner ersten Ehe sowie Sohn Jannes, der 2007 geboren wurde. Inzwischen ist er auch Großvater."
  - question: Ist Thomas Rühmann Musiker?
    answer: "Ja. Thomas Rühmann spielt Gitarre und singt. Gemeinsam mit seinem Bruder Martin Rühmann, einem bekannten Liedermacher, hat er mehrere Alben veröffentlicht. Musik ist neben der Schauspielerei seine zweite große Leidenschaft."
  - question: Was ist das Theater am Rand?
    answer: "Das «Theater am Rand» ist ein kleines Sommertheater in Zollbrücke im Oderbruch (Brandenburg), das Thomas Rühmann 1998 gemeinsam mit dem Akkordeonisten Tobias Morgenstern gründete. Seit 2023 leitet Rühmann es allein."
takeaways:
  - "Thomas Rühmann spielt seit 1998 ununterbrochen Dr. Roland Heilmann in «In aller Freundschaft» — eine der langlebigsten Hauptrollen in der Geschichte des deutschen Fernsehens."
  - "Neben der Schauspielerei lebt er seine Leidenschaft als Musiker und Theatermacher aus: Das «Theater am Rand» im Oderbruch ist sein persönliches Herzprojekt seit über 25 Jahren."
  - "Als Familienvater und Großvater führt der Sachsen-Anhalter ein bodenständiges Leben in Leipzig — weit entfernt vom Glamour der Branche."
