intro: "Jannik Schümann ist einer der vielseitigsten deutschen Schauspieler seiner Generation. Als Otto Marquardt in «Charité» Staffel 2 — einem Medizinstudenten im Berlin des Jahres 1943 — lieferte er 2019 eine der eindringlichsten Leistungen der ARD-Serie. Bekannt wurde er einem breiten Publikum später als Kaiser Franz Joseph I. in der ZDF-Erfolgsserie «Sisi». Privat lebt der in Hamburg geborene Schauspieler offen mit seinem Partner Felix Kruck zusammen."
