intro: "Werner Mang ist Deutschlands bekanntester Schönheitschirurg — Gründer der Bodenseeklinik in Lindau, bekannt als «Gesichtschirurg der Reichen und Schönen» und seit Jahrzehnten Stimme für einen ganzheitlichen Blick auf Ästhetik und innere Zufriedenheit. Seit er die Klinikleitung an Tochter Gloria übergeben hat, ist er vor allem als Pilger auf dem Camino de Santiago und — überraschend — als Fastenprediger in Erscheinung getreten."
