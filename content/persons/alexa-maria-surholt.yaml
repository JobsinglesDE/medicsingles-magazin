intro: "Alexa Maria Surholt ist seit Oktober 1998 das Gesicht der Sachsenklinik-Verwaltung in «In aller Freundschaft». Als Verwaltungsdirektorin Sarah Marquardt hielt sie über zwei Jahrzehnte lang den Laden zusammen — mal mit Samthandschuhen, mal mit eiserner Hand. Die in Erlangen geborene Schauspielerin ist eine der wenigen Darsteller der ARD-Serie, die von der allerersten Folge an dabei sind."
