intro: "Hans-Wilhelm Müller-Wohlfahrt ist einer der bekanntesten Orthopäden und Sportmediziner Deutschlands. 40 Jahre lang war der Münchner Arzt — zunächst von 1977 bis 2015, dann erneut 2017 bis 2020 — Teamarzt des FC Bayern München und über zwei Jahrzehnte lang Arzt der deutschen Fußball-Nationalmannschaft. Sein eigenes Behandlungskonzept mit biologischen Substanzen brachte ihm den Ruf des «Wunderheilers» ein. Im April 2026 schlug der 83-Jährige Alarm: Die Wiederverletzungsrate im Profifußball sei so hoch wie nie."
