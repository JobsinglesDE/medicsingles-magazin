faqItems:
  - question: Wie alt ist Andrea Kathrin Loewig?
    answer: "Andrea Kathrin Loewig wurde am 22. September 1966 in Merseburg (DDR) geboren. Sie ist damit Jahrgang 1966 und im Jahr 2026 59 Jahre alt."
  - question: Seit wann spielt Andrea Kathrin Loewig die Dr. Kathrin Globisch?
    answer: "Andrea Kathrin Loewig ist seit 1999 in «In aller Freundschaft» dabei — sie stieg in der zweiten Staffel ein und spielt Dr. Kathrin Globisch seitdem durchgehend. Damit gehört sie zu den dienstältesten Schauspielerinnen der Serie."
  - question: Wer ist der Ehemann von Andrea Kathrin Loewig?
    answer: "Andrea Kathrin Loewig ist seit Juli 2021 mit dem Berliner Architekten Andreas Thiele verheiratet. Das Paar ist seit 2014 zusammen."
  - question: Hat Andrea Kathrin Loewig Kinder?
    answer: "Ja, Andrea Kathrin Loewig hat eine Tochter, die im Juli 2008 geboren wurde — aus einer früheren Beziehung."
  - question: Wo wurde Andrea Kathrin Loewig ausgebildet?
    answer: "Sie studierte Schauspiel an der renommierten Hochschule für Schauspielkunst «Ernst Busch» in Berlin und besuchte zusätzlich die Staatliche Ballettschule Berlin sowie 1998 den Hollywood Acting Workshop in Los Angeles."
takeaways:
  - "Andrea Kathrin Loewig verkörpert seit 1999 Dr. Kathrin Globisch in «In aller Freundschaft» und zählt damit zu den Dauerstars der deutschen TV-Medizinserie."
  - "Ihre Wurzeln liegen in der DDR — die Ausbildung an der «Ernst Busch» in Berlin und eine frühe Theaterlaufbahn prägten sie als Schauspielerin."
  - "Abseits der Kamera ist sie leidenschaftliche Ayurveda-Anhängerin und hat ihr Wissen sogar in einem Buch weitergegeben."
