faqItems:
  - question: Wie alt ist Kevin McKidd?
    answer: "Kevin McKidd wurde am 9. August 1973 in Elgin, Schottland, geboren. Im Jahr 2026 ist er 52 Jahre alt."
  - question: Wann hat Kevin McKidd Grey's Anatomy verlassen?
    answer: "Kevin McKidd verließ «Grey's Anatomy» im Finale der 22. Staffel, das am 7. Mai 2026 in den USA ausgestrahlt wurde. Sein Charakter Dr. Owen Hunt zieht mit Ehefrau Teddy und den Kindern nach Paris, wo Teddy eine neue Führungsposition übernimmt. Insgesamt war McKidd 17 Staffeln lang dabei."
  - question: Welche Rolle spielte Kevin McKidd in Grey's Anatomy?
    answer: "Kevin McKidd spielte Dr. Owen Hunt, einen erfahrenen Militärchirurgen mit PTBS, der am Grey Sloan Memorial Hospital in Seattle arbeitet. Die Figur debütierte in der 5. Staffel im Jahr 2008 und war über 18 Jahre ein zentraler Bestandteil der Serie."
  - question: Hat Kevin McKidd auch Regie geführt?
    answer: "Ja. Kevin McKidd führte bei mehreren Episoden von «Grey's Anatomy» Regie. Sein Regiedebüt hatte er in Staffel 7 mit der Episode «Don't Deceive Me (Please Don't Go)». Seitdem inszenierte er regelmäßig weitere Folgen."
  - question: Woher stammt Kevin McKidd?
    answer: "Kevin McKidd stammt aus Elgin, einer Kleinstadt im Nordosten Schottlands. Er studierte Darstellende Künste an der Queen Margaret University in Edinburgh, bevor er seine internationale Schauspielkarriere startete."
takeaways:
  - "Kevin McKidd spielte Dr. Owen Hunt 17 Staffeln lang in «Grey's Anatomy» — von 2008 bis zum Serienfinale der 22. Staffel im Mai 2026. Damit ist er einer der am längsten aktiven Hauptdarsteller der Serie."
  - "Neben seiner Schauspielarbeit etablierte er sich als Regisseur und inszenierte zahlreiche Episoden der Serie — ein seltenes Doppeltalent im Seriengeschäft."
  - "Als gebürtiger Schotte brachte McKidd eine unverwechselbare Energie in die Rolle des Militärarztes Owen Hunt und machte die Figur zu einem der komplexesten Charaktere der Serie."
