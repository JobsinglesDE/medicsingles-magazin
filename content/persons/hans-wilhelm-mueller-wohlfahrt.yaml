faqItems:
  - question: Wer ist Hans-Wilhelm Müller-Wohlfahrt?
    answer: "Hans-Wilhelm Müller-Wohlfahrt (geb. 1943) ist ein Münchner Orthopäde und Sportmediziner. Er war 40 Jahre lang Teamarzt des FC Bayern München (1977–2015 und 2017–2020) und über zwei Jahrzehnte Arzt der deutschen Fußball-Nationalmannschaft. Bekannt wurde er durch sein eigenes Behandlungskonzept mit biologischen Substanzen, das ihm den Ruf des «Wunderheilers» einbrachte."
  - question: Warum verließ Müller-Wohlfahrt Bayern München 2015?
    answer: "Nach einem öffentlichen Konflikt mit Trainer Pep Guardiola trat Müller-Wohlfahrt 2015 zurück. Guardiola hatte ihm vorgeworfen, verletzte Spieler zu lange aus dem Spielbetrieb zu nehmen. Müller-Wohlfahrt wollte seine medizinischen Standards nicht dem sportlichen Betrieb unterordnen. Unter Jupp Heynckes kehrte er zurück; 2020 verließ er Bayern endgültig."
  - question: Was warnt Müller-Wohlfahrt im April 2026?
    answer: "Im April 2026 erklärte Müller-Wohlfahrt, die Quote der Wiederverletzungen im Profifußball sei so hoch wie nie. Er macht wirtschaftlichen Druck auf Vereine verantwortlich: Klubs drängen verletzte Topspieler zu früh zurück, weil deren Ausfall den sportlichen Erfolg gefährdet — auf Kosten der Gesundheit der Spieler."
  - question: Welche Sportler behandelt Müller-Wohlfahrt heute?
    answer: "In seiner Münchner Praxis behandelt Müller-Wohlfahrt weiterhin Spitzensportler verschiedener Disziplinen: darunter Eishockey-Star Leon Draisaitl, Basketballer Dennis Schröder und Tennisprofi Alexander Zverev. Er plant, weiterzuarbeiten, «bis mir der Himmel signalisiert: Es ist genug.»"
takeaways:
  - "Hans-Wilhelm Müller-Wohlfahrt, 83, warnte im April 2026 vor einem historischen Höchststand an Wiederverletzungen im Profifußball — ausgelöst durch wirtschaftlichen Druck auf Vereine."
  - "2015 trat er als Bayern-Arzt zurück, weil er Pep Guardiolas Forderungen nach kürzeren Genesungszeiten ablehnte — und stellte ärztliche Integrität über Vereinsinteressen."
  - "In seiner Münchner Praxis behandelt er bis heute Topsportler wie Draisaitl, Schröder und Zverev — sein Fazit nach vier Jahrzehnten: «Der Profisport ist kälter und unpersönlicher geworden.»"
