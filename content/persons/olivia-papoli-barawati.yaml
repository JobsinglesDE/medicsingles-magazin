intro: "Olivia Papoli-Barawati spielt seit Februar 2024 die Assistenzärztin Sofia Galura in «In aller Freundschaft – Die jungen Ärzte». Die 1995 in Osnabrück geborene Schauspielerin kommt vom Musicaltheater, stand jahrelang am Schauspielhaus Kiel und am Anhaltischen Theater Dessau auf der Bühne — und rückt in Staffel 12 endgültig ins Zentrum der Serie. Privat lebt sie in Berlin und hält ihr Leben abseits der Kamera bewusst zurück."
