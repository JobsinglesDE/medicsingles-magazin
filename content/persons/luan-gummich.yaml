intro: "Luan Gummich spielt seit 2018 Dr. Mikko Rantala in «In aller Freundschaft – Die jungen Ärzte» — einen finnischen Assistenzarzt, der sich über fast 200 Episoden zum Facharzt mit klarer moralischer Haltung entwickelt hat. Privat ist der 1989 in Köln geborene Schauspieler das genaue Gegenteil seiner stillen Figur: gesprächig, mit brasilianischen Wurzeln, Wahl-Berliner — und konsequent diskret, wenn es um sein Liebesleben geht."
