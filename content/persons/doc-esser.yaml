faqItems:
  - question: Wer ist Doc Esser?
    answer: "Doc Esser ist Dr. med. Heinz-Wilhelm Esser, geboren am 25. April 1974 in Mönchengladbach. Er ist Facharzt für Innere Medizin mit den Schwerpunkten Pneumologie und Kardiologie und seit 2016 Moderator des WDR-Gesundheitsmagazins. Der Spitzname stammt aus dem Sendungstitel und hat sich als Markenzeichen etabliert."
  - question: Wo arbeitet Doc Esser als Arzt?
    answer: "Heinz-Wilhelm Esser ist Leitender Oberarzt der Sektion Pneumologie am Sana-Klinikum Remscheid. Parallel ist er Partner der kardiologisch-pneumologischen Privatpraxis cardiomed24 in Meerbusch. Seit 2020 ist Long COVID ein klinischer Schwerpunkt."
  - question: Wie viele Bücher hat Doc Esser geschrieben?
    answer: "Doc Esser hat mehrere Bücher veröffentlicht, darunter \"Das große Gesundheitsbuch Innere Medizin\" (2020), \"Health Food Rock n Roll\" (2021), \"Das Prinzip der Mutigen\" (2023) und das Lungenbuch \"Einfach atemberaubend\" (2025). Die Titel decken Innere Medizin, Ernährung, Resilienz und Lungengesundheit ab."
  - question: Hat Doc Esser Familie?
    answer: "Heinz-Wilhelm Esser ist Vater von vier Kindern — drei Töchtern und einem Sohn. Er lebt in Köln. Zu seiner Partnerin macht er bewusst keine öffentlichen Angaben; eine namentlich bekannte Frau ist in seriösen Quellen nicht dokumentiert."
  - question: Was ist Doc Essers Position zur sprechenden Medizin?
    answer: "Im WDR-Kölner-Treff am 5. Juni 2026 warnte Doc Esser, dass Gesundheitsreformen den Arzt-Patienten-Dialog gefährden könnten. Er bezeichnet das Gespräch als unverzichtbares diagnostisches und therapeutisches Werkzeug — gerade bei psychosomatischen Erkrankungen wie dem Broken-Heart-Syndrom."
takeaways:
  - "Doc Esser ist kein reines TV-Gesicht, sondern aktiver Klinikarzt: Leitender Oberarzt der Sektion Pneumologie am Sana-Klinikum Remscheid und Partner der Privatpraxis cardiomed24 in Meerbusch."
  - "Seine WDR-Karriere läuft seit 2016 und umfasst mehrere Spin-offs, zwei Podcasts und eine Buchreihe, die von Innerer Medizin über Ernährung bis zu Resilienz reicht."
  - "Vier Kinder, eine Band, Oberarzt-Stelle, Privatpraxis und WDR-Format — Doc Essers Karriere zeigt, wie eine Mehrfachrolle in der Medizin strukturiert möglich ist."
