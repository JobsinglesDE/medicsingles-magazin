faqItems:
  - question: Wer ist Luise Wolfram?
    answer: "Luise Wolfram ist eine deutsche Schauspielerin, geboren am 27. Juli 1987 in Apolda in Thüringen. Sie studierte an der Hochschule für Schauspielkunst Ernst Busch in Berlin und ist heute vor allem durch ihre Rolle als BKA-Ermittlerin Linda Selb im Tatort Bremen und durch die ARD-Historieserie «Charité» bekannt, in der sie Margot Sauerbruch spielte."
  - question: Welche Rolle spielt Luise Wolfram in «Charité»?
    answer: "In der zweiten Staffel von «Charité» (ARD, 2019) spielt Luise Wolfram Margot Sauerbruch, die Ehefrau des Starchirugen Prof. Ferdinand Sauerbruch (Ulrich Noethen). Die Handlung spielt in den letzten Kriegsjahren 1943–1945 an der Berliner Charité. Das historische Vorbild Margot Sauerbruch war Medizinstudentin, OR-Assistentin und heiratete Sauerbruch, der mehr als dreißig Jahre älter war als sie."
  - question: Seit wann ist Luise Wolfram im Tatort Bremen zu sehen?
    answer: "Luise Wolfram ist seit 2016 als BKA-Spezialistin Linda Selb im Tatort Bremen dabei. Ursprünglich nur für einen einzigen Film geplant, entwickelte sich die Rolle zum Dauereinsatz. Ab 2021 bildet sie gemeinsam mit Jasna Fritzi Bauer das neue Bremer Ermittler-Duo, nachdem das langjährige Team Lürsen und Stedefreund ausschied."
  - question: Wo wurde Luise Wolfram geboren und wo ist sie aufgewachsen?
    answer: "Luise Wolfram wurde am 27. Juli 1987 in Apolda in Thüringen geboren, das damals zur DDR gehörte. Sie wuchs in Jena auf. Ihre Schauspielkarriere begann früh: Bereits mit sieben Jahren spielte sie in dem Kinderfilm «Engelchen» mit."
  - question: Hat Luise Wolfram Schauspiel studiert?
    answer: "Ja. Luise Wolfram begann 2006 ihr Studium an der Hochschule für Schauspielkunst Ernst Busch in Berlin — einer der renommiertesten Schauspielschulen im deutschsprachigen Raum. Nach dem Abschluss wurde sie direkt an die Schaubühne am Lehniner Platz engagiert."
takeaways:
  - "Luise Wolfram verkörpert in «Charité» Staffel 2 die reale Margot Sauerbruch — eine selbstbewusste Frau, die in den letzten Kriegsjahren an der Berliner Charité zwischen Medizin, Loyalität und dem Wahnsinn des Krieges navigierte."
  - "Als BKA-Ermittlerin Linda Selb im Tatort Bremen ist Wolfram seit 2016 aus der deutschen Krimiszene nicht mehr wegzudenken — seit 2021 als feste Partnerin von Jasna Fritzi Bauer."
  - "Die Thüringerin startete als Kinderschauspielerin, absolvierte die Ernst-Busch-Hochschule und debütierte an der Schaubühne — ein klassischer, konsequenter Schauspielweg ohne Abkürzungen."
