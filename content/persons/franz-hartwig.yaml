faqItems:
  - question: Welche Rolle spielt Franz Hartwig in «Charité» Staffel 3?
    answer: "Franz Hartwig spielt in der dritten Staffel von «Charité» (ARD, Januar 2021) den Chirurgen Dr. Curt Bruncken. Die Handlung spielt 1961 kurz vor dem Mauerbau in Ost-Berlin. Brunckens Figur fasziniert die junge Ärztin Ella Wendt mit seinem Freiheitsdrang und seiner rebellischen Haltung gegenüber dem DDR-System."
  - question: Wofür erhielt Franz Hartwig den Grimme-Preis?
    answer: "Franz Hartwig wurde 2020 mit dem Grimme-Preis ausgezeichnet — für seine Darstellung des charismatischen Serienkillers Gregor Ansbach in der deutsch-österreichischen Sky-Serie «Der Pass – Pagan Peak» (2018–2019). Die Rolle gilt als sein schauspielerischer Durchbruch im deutschen Fernsehen."
  - question: Wo hat Franz Hartwig Schauspiel studiert?
    answer: "Franz Hartwig studierte von 2006 bis 2010 an der Hochschule für Schauspielkunst Ernst Busch in Berlin. Bereits während des Studiums trat er am bat-Studiotheater Berlin auf. Nach dem Abschluss wurde er festes Ensemblemitglied der renommierten Schaubühne am Lehniner Platz (2009–2014)."
  - question: In welchen bekannten Produktionen war Franz Hartwig zu sehen?
    answer: "Franz Hartwig war u.a. in «Der Pass – Pagan Peak» (Sky, 2018–2019), «Charité» Staffel 3 (ARD, 2021), dem Kinofilm «A Most Wanted Man» (2014, mit Philip Seymour Hoffman) sowie dem Doku-Drama «Der große Fake – Die Wirecard-Story» (2021) zu sehen, in dem er Jan Marsalek, Ex-Vorstand der Wirecard AG, verkörpert."
  - question: Was ist die Handlung von «Charité» Staffel 3?
    answer: "Die dritte Staffel spielt im Sommer 1961, kurz vor dem Mauerbau. Im Mittelpunkt steht die junge Ärztin Ella Wendt (Nina Gummich), die neu an die Charité kommt und ihre Krebsforschung vorantreiben will. Parallel entwickelt sich eine intensive Beziehung zwischen Ella und dem Chirurgen Dr. Curt Bruncken (Franz Hartwig), der mit seiner rebellischen Art das System herausfordert."
takeaways:
  - "Franz Hartwig gehört zu den gefragtesten deutschen Charakterdarstellern: Grimme-Preis, Schaubühne Berlin und internationale Kinoerfahrung sprechen für sich."
  - "Als Dr. Curt Bruncken in «Charité» Staffel 3 (1961) verkörpert er einen Arzt zwischen persönlicher Freiheit und den Zwängen der DDR — eine der stärksten Rollen der ARD-Produktion."
  - "Sein Weg vom Dresdner Theaterkind über die Ernst-Busch-Hochschule bis zum Fernsehpreis zeigt, wie Handwerk und Ausdauer eine nachhaltige Karriere formen."
