intro: "Mike Adler spielt seit 2015 Dr. Matteo Moreau in «In aller Freundschaft – Die jungen Ärzte». Der am 20. März 1978 in West-Berlin geborene Schauspieler ist außerdem als Rapper Mike Fiction aktiv — seit 2001 Mitglied des Berliner Kollektivs KaosLoge. Sein Privatleben hält er konsequent aus der Öffentlichkeit heraus."
