faqItems:
  - question: Wie alt ist Mirka Pigulla?
    answer: "Mirka Pigulla wurde am 18. Mai 1985 in Bergisch Gladbach geboren. Sie ist damit Jahrgang 1985 und im Jahr 2026 40 Jahre alt."
  - question: Welche Rolle spielt Mirka Pigulla in «Die jungen Ärzte»?
    answer: "Mirka Pigulla spielt Dr. Julia Berger, die seit Staffel 2 (2015) in der ARD/MDR-Serie «In aller Freundschaft – Die jungen Ärzte» dabei ist. Aus einer Assistenzärztin wurde über die Staffeln eine Oberärztin der Allgemeinchirurgie an der Sachsenklinik in Leipzig."
  - question: Wo wurde Mirka Pigulla ausgebildet?
    answer: "Mirka Pigulla studierte Schauspiel zunächst an der Folkwang Universität der Künste in Essen, anschließend an der Hochschule für Musik, Theater und Medien Hannover (Abschluss 2012). Während des Studiums spielte sie bereits am Schauspiel Hannover, unter anderem die Hauptrolle in Ibsens «Nora»."
  - question: Hat Mirka Pigulla einen Partner oder Kinder?
    answer: "Mirka Pigulla macht zu ihrem Beziehungsstatus und einem möglichen Kinderwunsch keine öffentlichen Angaben. Weder ein Partner noch Kinder sind in Interviews oder auf ihrem Instagram-Account bestätigt. Sie trennt Privat- und Berufsleben sehr konsequent."
  - question: Seit wann ist Mirka Pigulla in «Die jungen Ärzte»?
    answer: "Mirka Pigulla stieg zur zweiten Staffel 2015 als Dr. Julia Berger in den Hauptcast ein und ist seitdem konstant dabei – damit gehört sie zu den dienstältesten Hauptfiguren der Serie."
takeaways:
  - "Mirka Pigulla spielt seit 2015 Dr. Julia Berger in «In aller Freundschaft – Die jungen Ärzte» und ist damit eine der beständigsten Hauptdarstellerinnen der ARD-Reihe."
  - "Theatralisch ausgebildet an der Folkwang Universität und der HMTM Hannover, sammelte sie erste TV-Erfahrungen vor dem Serienstart im Tatort und weiteren Produktionen."
  - "Privatleben, Beziehung und Familienstand hält Pigulla konsequent aus der Öffentlichkeit – ein bewusster Gegenentwurf zum durchstilisierten Social-Media-Auftritt vieler TV-Stars."
