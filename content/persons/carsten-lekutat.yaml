intro: "Carsten Lekutat ist Facharzt für Allgemeinmedizin, Charité-Lehrarzt und einer der bekanntesten TV-Ärzte Deutschlands. Von 2015 bis 2023 moderierte er das MDR-Gesundheitsmagazin Hauptsache gesund, heute ist er monatlich im ARD-Mittagsmagazin zu sehen und tourt mit seinem medizinischen Kabarettrogramm durch Deutschland. Seine Hausarztpraxis in Berlin-Tegel leitet er seit dem Jahr 2000 — bis heute als akademische Lehrpraxis der Charité."
