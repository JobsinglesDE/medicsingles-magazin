faqItems:
  - question: Wer steckt hinter Doc Fischer?
    answer: "Hinter dem Sendungsnamen Doc Fischer steht Dr. med. Julia Fischer, geboren 1984 in Aachen. Sie ist Ärztin, Wissenschaftsjournalistin und Autorin. Einen Dr. Thomas Fischer als Moderator, wie gelegentlich behauptet, gibt es nicht — Moderatorin ist ausschließlich Julia Fischer."
  - question: Wie alt ist Doc Fischer?
    answer: "Doc Fischer, also Dr. med. Julia Fischer, wurde 1984 in Aachen geboren und ist damit im Jahr 2026 etwa 42 Jahre alt. Ein genaues Geburtsdatum macht sie öffentlich nicht bekannt."
  - question: Seit wann läuft die Sendung Doc Fischer im SWR?
    answer: "Die Erstausstrahlung der Sendung Doc Fischer war am 10. Mai 2021 im SWR Fernsehen. Sie ersetzte das frühere Format Rundum gesund und läuft seitdem wöchentlich am Mittwoch in 45 Minuten Länge. Zusätzlich wird sie im SR Fernsehen ausgestrahlt und ist in der ARD-Mediathek abrufbar."
  - question: Welche Bücher hat Doc Fischer veröffentlicht?
    answer: "Dr. Julia Fischer veröffentlichte 2020 bei Drömer Knaur das populärwissenschaftliche Buch Die Medizin der Gefühle. 2022 erschien die überarbeitete Neuauflage unter dem Titel What a feeling. Beide Titel erklären, wie Emotionen körperlich wirken und welche neurobiologischen Mechanismen dahinterstehen."
  - question: Worüber hat Doc Fischer promoviert?
    answer: "Julia Fischer promovierte im September 2012 an einer Berliner Universitätsklinik zur kardialen Magnetresonanztomographie zur Evaluation des linken Atriums — ein Thema aus der klinischen Kardio-Bildgebung."
takeaways:
  - "Doc Fischer ist das Pseudonym für Dr. med. Julia Fischer, geboren 1984 in Aachen — keine erfundene Figur, sondern eine promovierte Ärztin mit journalistischem Volontariat."
  - "Die SWR-Sendung läuft seit dem 10. Mai 2021 wöchentlich und steht für evidenzbasiertes Gesundheits-TV ohne Lifestyle-Versprechen."
  - "Julia Fischer verbindet klinische Bildgebung, Wissenschaftsjournalismus, Buchprojekte und YouTube zu einem Profil, das zeigt: medizinische Identität hat viele Formen."
