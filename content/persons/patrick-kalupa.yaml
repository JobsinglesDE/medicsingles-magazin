faqItems:
  - question: Wen spielt Patrick Kalupa in «Dr. Nice»?
    answer: "Patrick Kalupa spielt in der ZDF-Serie «Dr. Nice» die Hauptrolle des Chirurgen Dr. Moritz Neiss — ein begabter Arzt mit viel Charme, der emotional und ein bisschen chaotisch ist und sich nicht allzu ernst nimmt. Die Figur startete 2023 als TV-Film und wurde aufgrund des Publikumserfolgs zur Eventserie ausgebaut."
  - question: Wie alt ist Patrick Kalupa?
    answer: "Patrick Kalupa wurde am 13. Oktober 1979 in Berlin geboren. Er ist damit Jahrgang 1979 und im Jahr 2026 46 Jahre alt."
  - question: Mit wem ist Patrick Kalupa verheiratet?
    answer: "Patrick Kalupa ist seit 2019 mit der Schauspielerin Leonie Parusel verheiratet. Das Paar hat zwei gemeinsame Töchter und lebt in Berlin-Weißensee."
  - question: Welche Serien hat Patrick Kalupa neben «Dr. Nice» gedreht?
    answer: "Patrick Kalupa ist aus mehreren bekannten deutschen Produktionen bekannt: Als Tom Lanford war er 2010–2012 in der Sat.1-Telenovela «Anna und die Liebe» zu sehen und gewann dafür den German Soap Award. Als Roman Kramer war er 2020–2023 in «Alarm für Cobra 11» dabei. Außerdem spielte er Jenne Derbeck in «In aller Freundschaft» (2016–2018) und trat in «Die Rosenheim-Cops» und «Beste Schwestern» auf."
  - question: Wie begann Patrick Kalupass Karriere?
    answer: "Patrick Kalupa begann seine Karriere um 2000 als Model, bevor er 2003 seine erste Filmrolle in der Komödie «Sex Up – Jungs haben's auch nicht leicht» übernahm. Eine Schauspielausbildung absolvierte er von 2003 bis 2005 und erneut von 2019 bis 2022. Der Durchbruch gelang ihm mit der Hauptrolle in «Anna und die Liebe» auf Sat.1."
takeaways:
  - "Patrick Kalupa spielt seit 2023 als Dr. Moritz Neiss die Hauptrolle in der ZDF-Serie «Dr. Nice» — ein smarter, etwas chaotischer Chirurg, der trotz seines Rufes als netter Kerl immer wieder aneckt."
  - "Der Berliner Schauspieler wurde einem breiten Publikum durch «Anna und die Liebe» und «Alarm für Cobra 11» bekannt und gewann 2011 den German Soap Award."
  - "Privat lebt er bodenständig mit Ehefrau Leonie Parusel und zwei Töchtern in Berlin — und vermietet nebenbei Flöße in Brandenburg."
