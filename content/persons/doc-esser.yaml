intro: "Doc Esser ist Dr. med. Heinz-Wilhelm Esser — Pneumologe, Kardiologe und seit 2016 das Gesicht des WDR-Gesundheitsmagazins. Als Leitender Oberarzt am Sana-Klinikum Remscheid und Partner der Privatpraxis cardiomed24 in Meerbusch verbindet er Klinikalltag und Medienpräsenz wie kaum ein anderer TV-Arzt in Deutschland. Sein Spitzname ist längst Markenzeichen."
