intro: "Mirka Pigulla spielt seit 2015 die Dr. Julia Berger in «In aller Freundschaft – Die jungen Ärzte». Die 1985 in Bergisch Gladbach geborene Schauspielerin gehört zu den dienstältesten Hauptdarstellerinnen der ARD-Serie – und zu den wenigen, die ihr Privatleben konsequent aus der Öffentlichkeit heraushalten."
