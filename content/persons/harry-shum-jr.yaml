faqItems:
  - question: Wer spielt Dr. Blue Kwan in Grey's Anatomy?
    answer: "Dr. Benson «Blue» Kwan wird von Harry Shum Jr. gespielt. Er wurde in Staffel 19 (2022) als Assistenzarzt der neuen Klasse am Grey Sloan Memorial Hospital eingeführt und gehört seitdem zum festen Cast."
  - question: Woher kennt man Harry Shum Jr.?
    answer: "Die meisten kennen Harry Shum Jr. als Mike Chang aus der Musical-Serie «Glee» (2009–2015), wo er als Tänzer und Schauspieler glänzte. Weltweit aufgefallen ist er auch als Waymond Wang in «Everything Everywhere All at Once» (2022), dem Oscar-Gewinner für den Besten Film."
  - question: Ist Harry Shum Jr. wirklich ein professioneller Tänzer?
    answer: "Ja. Harry Shum Jr. begann seine Karriere als professioneller Tänzer — spezialisiert auf Breakdance, Popping und Locking. Er war Teil von Imm4 Dance Crew und wirkte in Musikvideos von Beyoncé mit, bevor er zur Schauspielerei wechselte."
  - question: Woher stammt Harry Shum Jr.?
    answer: "Harry Shum Jr. wurde am 28. April 1982 in Limón, Costa Rica geboren. Seine Eltern haben chinesische Wurzeln aus der Provinz Guangdong. Er wuchs in San Francisco auf und besitzt die US-amerikanische Staatsbürgerschaft."
  - question: Ist Harry Shum Jr. verheiratet?
    answer: "Ja, Harry Shum Jr. ist seit 2015 mit der Schauspielerin und Tänzerin Shelby Rabara verheiratet. Das Paar hat eine gemeinsame Tochter, Xanthe Raina Shum, die 2016 geboren wurde."
takeaways:
  - "Harry Shum Jr. vereint als Tänzer und Schauspieler zwei Welten: Von Beyoncé-Musikvideos und «Glee» führte sein Weg über den Oscar-Gewinner «Everything Everywhere All at Once» direkt zum Grey Sloan Memorial Hospital."
  - "Als Dr. Blue Kwan in «Grey's Anatomy» (seit Staffel 19) bringt er eine frische Energie in die Serie — der Charakter entwickelt sich über die Staffeln vom ehrgeizigen Assistenzarzt zu einer moralisch komplexen Figur."
  - "Privat lebt er bodenständig: verheiratet mit Shelby Rabara, Vater einer Tochter — weit weg vom Hollywood-Klischee."
