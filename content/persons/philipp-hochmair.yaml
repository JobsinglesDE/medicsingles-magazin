faqItems:
  - question: Wer ist Philipp Hochmair?
    answer: "Philipp Hochmair ist ein österreichischer Schauspieler, geboren am 25. Juni 1973 in Wien. Er ist bekannt für seine Bühnenarbeit als Jedermann in Salzburg (2013–2017), für die ORF-Krimireihe «Blind ermittelt» (seit 2017) sowie die Netflix-Serie «Freud» (2020), in der er Sigmund Freud spielt. In «Charité» Staffel 3 verkörpert er den forensischen Pathologen Prof. Otto Prokop."
  - question: Welche Rolle spielt Philipp Hochmair in der Charité?
    answer: "Philipp Hochmair spielt in «Charité» Staffel 3 (ARD, 2021) die Figur des Prof. Otto Prokop. Die dritte Staffel der ARD-Serie spielt im Jahr 1961 an der Ost-Berliner Charité kurz vor dem Mauerbau und thematisiert den Exodus von Ärzten in den Westen. Otto Prokop war historisch einer der bedeutendsten forensischen Pathologen der DDR."
  - question: Was ist «Blind ermittelt»?
    answer: "«Blind ermittelt» ist eine österreichische Krimireihe des ORF, in der Philipp Hochmair seit 2017 den blinden Kriminalassistenten Alexander Haller spielt. Die Reihe wird regelmäßig auch in Deutschland im Ersten ausgestrahlt und hat sich als eine der erfolgreichsten österreichischen TV-Produktionen der vergangenen Jahre etabliert."
  - question: Was ist «Elektrohand Gottes»?
    answer: "«Elektrohand Gottes» ist das Elektropop-Musikprojekt von Philipp Hochmair gemeinsam mit dem Musiker und Produzenten Thomas Weigelt. Seit 2006 haben die beiden mehrere Alben veröffentlicht und treten mit Live-Performances auf, die Theater und Popkonzert verbinden. Das Projekt gilt als ungewöhnlicher Brückenschlag zwischen Hochkultur und elektronischer Musik."
  - question: Wie lange war Philipp Hochmair der Jedermann in Salzburg?
    answer: "Philipp Hochmair spielte den Jedermann bei den Salzburger Festspielen von 2013 bis 2017 — insgesamt fünf Spielzeiten. Die Rolle des Jedermann gilt als eine der prestigeträchtigsten des deutschsprachigen Theaters und wird traditionell auf dem Domplatz in Salzburg aufgeführt."
takeaways:
  - "Philipp Hochmair vereint Spitzentheater, populäres TV und Elektropop-Musik zu einer singulären Karriere — sein Jedermann in Salzburg (2013–2017) und sein Sigmund Freud für Netflix zeigen, wie weit sein Spektrum reicht."
  - "In «Charité» Staffel 3 spielt er Prof. Otto Prokop, den forensischen Pathologen der DDR-Charité im Jahr 1961 — eine historische Figur, die im realen Berlin kurz vor dem Mauerbau wirkte."
  - "Sein Privatleben hält Hochmair konsequent aus der Öffentlichkeit — im Mittelpunkt steht die Arbeit: Bühne, Kamera, und sein Elektropop-Alter-Ego «Elektrohand Gottes»."
