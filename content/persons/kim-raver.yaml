faqItems:
  - question: Wer ist Kim Raver?
    answer: "Kim Raver, bürgerlicher Name Kimberly Jayne Raver, ist eine US-amerikanische Schauspielerin, geboren am 15. März 1969 in New York City. Sie ist vor allem als Dr. Teddy Altman in «Grey's Anatomy» und als Audrey Raines in «24» bekannt."
  - question: Welche Rolle spielt Kim Raver in Grey's Anatomy?
    answer: "Kim Raver spielt Dr. Teddy Altman, eine erfahrene Herzchirurgin und enge Freundin von Owen Hunt. Sie ist seit Staffel 6 (2009) Teil der Serie, mit einigen Unterbrechungen, und verabschiedete sich in Staffel 22 aus dem Grey Sloan Memorial Hospital."
  - question: Ist Kim Raver verheiratet und hat sie Kinder?
    answer: "Ja. Kim Raver ist seit 1997 mit dem französischen Regisseur Manuel Boyer verheiratet. Das Paar hat drei gemeinsame Söhne: Luke (geboren 2002), Leo (geboren 2004) und Kai (geboren 2012)."
  - question: Was hat Kim Raver vor Grey's Anatomy gespielt?
    answer: "Vor ihrer Grey's-Anatomy-Zeit war Kim Raver in der Action-Serie «24» als Audrey Raines, der Liebe von Jack Bauer, zu sehen — von 2002 bis 2010. Außerdem spielte sie eine Hauptrolle in der NBC-Serie «Lipstick Jungle» (2008–2009)."
  - question: Warum hat Kim Raver Grey's Anatomy verlassen?
    answer: "Kim Raver verließ Grey's Anatomy in Staffel 22 nach über 15 Jahren als wiederkehrendes und festes Ensemblemitglied. Genaue Hintergründe wurden nicht offiziell kommuniziert; der Abschied ihrer Figur Dr. Teddy Altman wurde in der Handlung abgerundet."
takeaways:
  - "Kim Raver prägte «Grey's Anatomy» über mehr als 15 Jahre als Dr. Teddy Altman — eine leidenschaftliche Herzchirurgin mit bewegter persönlicher Geschichte."
  - "Vor Grey's Anatomy bewies sie als Audrey Raines in «24» ihr Talent für intensive Serienstoffe mit internationalem Publikum."
  - "Privat lebt sie seit fast drei Jahrzehnten mit Regisseur Manuel Boyer zusammen — eine bemerkenswerte Beständigkeit im Hollywood-Betrieb."
