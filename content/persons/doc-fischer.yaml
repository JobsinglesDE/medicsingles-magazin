intro: "Doc Fischer ist das bekannteste Gesicht im deutschen Gesundheits-TV — seit Mai 2021 moderiert Dr. med. Julia Fischer das gleichnamige Magazin im SWR Fernsehen. Die 1984 in Aachen geborene Ärztin verbindet klinische Bildgebung, eine abgeschlossene Promotion und ausgebildeten Wissenschaftsjournalismus zu einem Profil, das im öffentlich-rechtlichen Fernsehen selten ist. Bücher, YouTube und NDR-Vertretungen runden ihr Wirken ab."
