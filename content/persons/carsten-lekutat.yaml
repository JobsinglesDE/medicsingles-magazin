faqItems:
  - question: Wer ist Carsten Lekutat?
    answer: "Carsten Lekutat ist ein deutscher Facharzt für Allgemeinmedizin und Sportmedizin, geboren 1971 in West-Berlin. Er leitet das Hausarztzentrum in Berlin-Tegel — eine akademische Lehrpraxis der Charité —, war von 2015 bis 2023 Moderator des MDR-Gesundheitsmagazins Hauptsache gesund und ist als Buchautor und Kabarettist bundesweit bekannt."
  - question: Wo praktiziert Carsten Lekutat als Hausarzt?
    answer: "Carsten Lekutat führt seit 2000 das Hausarztzentrum in Berlin-Tegel. Seit 2002 ist die Praxis akademische Lehrpraxis der Charité Berlin, in der Studierende der Humboldt-Universität ihre Ausbildung in Allgemeinmedizin absolvieren können."
  - question: Ist Carsten Lekutat verheiratet?
    answer: "Carsten Lekutat ist mit Jasmin Lekutat verheiratet. Das Paar hat zwei Töchter. Gemeinsame öffentliche Auftritte, etwa bei der Jose-Carreras-Gala, sind belegt. Über das engere Familienleben hinaus hält er sein Privatleben bewusst zurück."
  - question: Welche Bücher hat Carsten Lekutat geschrieben?
    answer: "Zu seinen bekanntesten Titeln zählen «Halbwahrheiten der Medizin» (2013), der Bestseller «Ein Apfel macht gesund, drei Äpfel machen eine Fettleber» (Becker Joest Volk, 3. Auflage 2019) sowie mehrere Ratgeber bei Drömer Knaur, darunter «Schlank für Faule», «Die 1-Minuten-Strategie», «Der Vital-Code» und «müde?»."
  - question: Was macht Carsten Lekutat heute?
    answer: "Carsten Lekutat leitet weiterhin sein Hausarztzentrum in Berlin-Tegel. Seit Januar 2024 ist er monatlich als Gesundheitsexperte im ARD-Mittagsmagazin zu sehen. Parallel tourt er mit dem Kabarettprogramm «Wie Kekse Ihr Leben retten können» durch Deutschland."
takeaways:
  - "Carsten Lekutat verbindet Hausarztpraxis, Charité-Lehrtätigkeit, TV-Auftritte und Bühnenshow zu einem einzigartigen Profil unter den deutschen TV-Ärzten."
  - "Sein Hausarztzentrum in Berlin-Tegel ist seit 2002 akademische Lehrpraxis der Charité — das Fundament seiner öffentlichen Glaubwürdigkeit als Mediziner."
  - "Mit Büchern, MDR, ARD und Kabarett zeigt Lekutat, wie man als Arzt Sichtbarkeit aufbaut, ohne die Patientenversorgung aufzugeben."
