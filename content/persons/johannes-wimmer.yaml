faqItems:
  - question: Wer ist Johannes Wimmer?
    answer: "Dr. Johannes Wimmer (geboren am 16. Mai 1983 in Hamburg) ist ein deutscher Arzt, TV-Moderator und Health-Influencer. Bekannt wurde er durch eigene Sendungen beim NDR und bei Sat.1 sowie durch seine Social-Media-Marke Doctor Johannes auf YouTube und Instagram. Studiert hat er Humanmedizin in Marburg und Lübeck, promoviert wurde er 2011 zur Magnetresonanztomographie in der Knorpelforschung."
  - question: Welche TV-Sendungen hat Johannes Wimmer moderiert?
    answer: "Johannes Wimmer startete 2015 mit einer Ratgeber-Rubrik im NDR-Gesundheitsmagazin Visite, ab Ende Mai 2016 lief sein eigenes Format \"Dr. Wimmer – Wissen ist die beste Medizin\" im NDR. Im Privatfernsehen moderierte er \"Die Dr. Wimmer Show\" auf Sat.1. Von September 2022 bis November 2023 war er gemeinsam mit Bettina Tietjen Moderator der NDR Talk Show."
  - question: Was macht Doctor Johannes auf YouTube?
    answer: "Auf seinem YouTube-Kanal Doctor Johannes erklärt Johannes Wimmer alltagsnah medizinische Themen wie Symptome, Diagnosen und Prävention — ohne Fachsprache, aber mit ärztlicher Substanz. Der Kanal zählt zu den reichweitenstärksten deutschsprachigen Arzt-Kanälen mit sechsstelliger Abonnentenzahl."
  - question: Welche Bücher hat Johannes Wimmer veröffentlicht?
    answer: "Zu den bekanntesten Büchern zählen \"Fragen Sie Dr. Johannes\" (2015), \"Alles über die Haut\" (2016), \"Meine Hormone, bin ich ferngesteuert?\" (2018) und \"Ein Schnupfen ist kein Beinbruch\" (2018). Mehrere Titel standen auf der SPIEGEL-Bestsellerliste."
  - question: Welche Unternehmen hat Johannes Wimmer gegründet?
    answer: "Johannes Wimmer gründete 2011 die MedServation GmbH, in der er seine Medien- und Kommunikationsaktivitäten bündelt. 2023 kam die Mitgründung der Pflege ABC GmbH hinzu, die praxisnahe Pflegekurse und digitale Weiterbildung für Fachkräfte und pflegende Angehörige anbietet."
takeaways:
  - "Johannes Wimmer verbindet klinische Ausbildung am UKE Hamburg, TV-Formate bei NDR und Sat.1 sowie eine reichweitenstarke YouTube-Marke zu einem einzigartigen Berufsbild zwischen Medizin und Medien."
  - "Als Sachbuchautor mit mehreren SPIEGEL-Bestseller-Titeln und Gründer der MedServation GmbH zeigt er, dass eine zweite Karriere-Achse neben der Klinik realistisch aufgebaut werden kann."
  - "Sein Auftritt als Keynote-Speaker auf der Pro Care 2026 in Hannover und die Gründung der Pflege ABC GmbH belegen ein konsequentes Engagement für Patient-Education weit über das Fernsehen hinaus."
