faqItems:
  - question: Wer ist Hedwig Freiberg in der Serie Charité?
    answer: "Hedwig Freiberg ist eine der zentralen Frauenfiguren in «Charité» Staffel 1 (1888). Sie ist die Verlobte und spätere Ehefrau des Bakteriologen Robert Koch. Emilia Schüle spielt sie als junge Frau, die im engen Korsett der wilhelminischen Gesellschaft ihren eigenen Weg sucht. Die Figur basiert auf der historischen Hedwig Freiberg, die Koch 1893 heiratete."
  - question: Wie alt ist Emilia Schüle?
    answer: "Emilia Schüle wurde am 28. November 1992 in Blagoweschtschensk in Russland geboren. Im Jahr 2026 ist sie 33 Jahre alt. Sie ist als Kleinkind mit ihren Eltern nach Berlin gezogen, wo sie aufgewachsen ist und zur Schule gegangen ist."
  - question: Welche Rollen hat Emilia Schüle außer Charité gespielt?
    answer: "Emilia Schüle ist vor allem für ihre Hauptrolle als Eva Schöllack in der ZDF-Kultserie «Ku'damm 56» (2016), «Ku'damm 59» (2018) und «Ku'damm 63» (2021) bekannt. International bekannt wurde sie als Hauptdarstellerin in der Canal+-Serie «Marie Antoinette» (Staffel 1: 2022, Staffel 2: 2025). Dazu kommen Kinofilme wie «Freche Mädchen» (2008) und «Boy 7» (2015)."
  - question: Spricht Emilia Schüle wirklich Französisch?
    answer: "Ja, Emilia Schüle spricht Deutsch, Englisch, Französisch und Russisch fließend. Ihre Mehrsprachigkeit ist ein Schlüssel zu ihrer internationalen Karriere — für die Serienproduktion «Marie Antoinette» von Canal+ war sie als englischsprachige Produktion besetzt, die sie zusammen mit einem internationalen Cast dreht."
  - question: Wo ist Emilia Schüle aufgewachsen?
    answer: "Emilia Schüle wurde 1992 im russischen Blagoweschtschensk geboren. Ihre Eltern, ein Psychiater und ein Internist, kamen als Spätaussiedler nach Deutschland — mit der damals einjährigen Emilia. Sie wuchs in Berlin auf, besuchte eine Eliteschule und machte ihr Abitur an einer internationalen Schule in der Hauptstadt."
takeaways:
  - "Emilia Schüle verkörpert Hedwig Freiberg in «Charité» Staffel 1 — eine historische Figur aus dem Berlin des Jahres 1888, die im wilhelminischen Korsett ihren eigenen Weg zu gehen versucht."
  - "Von Berlin in die Welt: Die viersprächige Schauspielerin ist heute international mit der Canal+-Serie «Marie Antoinette» bekannt — als Titelfigur auf Englisch, Deutsch und Französisch."
  - "Emilia Schüle verbindet deutsch-russische Wurzeln mit einer Berliner Karriere — ein Werdegang, der für Vielseitigkeit und Ernsthaftigkeit vor der Kamera steht."
