faqItems:
  - question: Wer ist Alexa Maria Surholt?
    answer: "Alexa Maria Surholt ist eine deutsche Schauspielerin, geboren am 28. Januar 1968 in Erlangen. Sie absolvierte ihre Schauspielausbildung von 1991 bis 1994 an der Maria-Körber-Schule in Berlin. Bekannt wurde sie durch ihre Dauerrolle als Verwaltungsdirektorin Sarah Marquardt in der ARD-Serie «In aller Freundschaft», in der sie seit der ersten Folge im Oktober 1998 mitspielt."
  - question: Welche Rolle spielt Alexa Maria Surholt in «In aller Freundschaft»?
    answer: "Sie spielt Sarah Marquardt — die Verwaltungsdirektorin der Sachsenklinik. Die Figur ist eine der zentralen Charaktere der Serie: pragmatisch, durchsetzungsstark und dabei menschlich. Zeitweise übernahm Sarah Marquardt auch kommissarisch die Klinikleitung. Seit 2015 ist Surholt zudem in unregelmäßigen Abständen im Spin-off «In aller Freundschaft – Die jungen Ärzte» zu sehen."
  - question: Wann begann Alexa Maria Surholt bei «In aller Freundschaft»?
    answer: "Alexa Maria Surholt ist seit der allerersten Folge im Oktober 1998 dabei — sie gehört damit zu den wenigen Originalcast-Mitgliedern der ARD-Serie. Über mehr als zwei Jahrzehnte prägte sie mit ihrer Figur Sarah Marquardt das Bild der Sachsenklinik entscheidend mit."
  - question: Ist Alexa Maria Surholt verheiratet?
    answer: "Ja. Alexa Maria Surholt heiratete 2016 ihren langjährigen Lebensgefährten Jens Leon Tiedemann — nach 28 gemeinsamen Jahren. Das Paar hat einen Sohn und lebt in Berlin und Hamburg. Über das späte Ja-Wort sprach Surholt offen: Sie hätten einfach Lust gehabt, endlich zu heiraten."
  - question: Welche anderen Rollen hat Alexa Maria Surholt gespielt?
    answer: "Neben «In aller Freundschaft» spielte sie von 2012 bis 2017 in der ZDF-Krimiserie «Alles Klara» die Kriminalrätin Dr. Gertrud Müller-Dietz. In Kinofilmen war sie 1995 an der Seite von Götz George in «Der Sandmann» und 2004 in Marco Kreuzpaintners Erfolgsfilm «Sommersturm» zu sehen. Dazu kommen Gastrollen in «Tatort», «Polizeiruf 110» und «Der Bergdoktor»."
  - question: Woran erkrankte Alexa Maria Surholt?
    answer: "Im Oktober 2020 machte Alexa Maria Surholt öffentlich, dass sie an Hashimoto-Thyreoiditis leidet — einer Autoimmunerkrankung der Schilddrüse. Sie sprach damit für viele Betroffene, die mit ähnlichen Beschwerden kämpfen, ohne eine klare Diagnose zu haben."
takeaways:
  - "Alexa Maria Surholt spielt Sarah Marquardt seit Oktober 1998 — sie ist eine der wenigen Schauspielerinnen, die von der ersten Folge von «In aller Freundschaft» an dabei sind und die ARD-Serie über mehr als 25 Jahre geprägt haben."
  - "Ihre Figur Sarah Marquardt wuchs von der Verwaltungsdirektorin zur zeitweisen Klinikleiterin — und spiegelt damit genau den Karriereweg wider, den viele Frauen im Gesundheitswesen kennen: hart erkämpft, selten selbstverständlich."
  - "Privat heiratete Surholt nach 28 Jahren Beziehung — ein Zeichen für Beständigkeit, das in der Unterhaltungsbranche heute so selten ist wie ein freier Parkplatz vor der Sachsenklinik."
