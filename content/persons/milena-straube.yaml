faqItems:
  - question: Wann wurde Milena Straube geboren?
    answer: "Milena Straube wurde am 14. August 1992 in Berlin geboren. Sie wuchs zweisprachig auf — Deutsch und Französisch — und besuchte das Französische Gymnasium Berlin."
  - question: Welche Rolle spielt Milena Straube in «Die jungen Ärzte»?
    answer: "Milena Straube spielt seit 2019 Rebecca Krieger in «In aller Freundschaft – Die jungen Ärzte» (ARD). In Staffel 12 kehrt ihre Figur als frischgebackene Mutter ans Johannes-Thal-Klinikum zurück."
  - question: Hat Milena Straube einen Grimme-Preis gewonnen?
    answer: "Ja. Milena Straube gewann 2024 den Grimme-Preis Spezial für ihre Hauptrolle als Luise in der Miniserie «Haus Kummerveldt» (WDR/ZDF/ARTE). Der Grimme-Preis gilt als wichtigste TV-Auszeichnung im deutschsprachigen Raum."
  - question: Hat Milena Straube Kinder?
    answer: "Ja. Milena Straube wurde Anfang 2022 Mutter. Die Geburt fand als Hausgeburt statt — nach 34 Stunden Wehen. Den Moment teilte sie kurz auf Instagram, ohne Homestory."
  - question: Wer ist der Partner von Milena Straube?
    answer: "Milena Straubes Partner ist der Schauspieler Marius Bistritzky. Beide halten ihr Privatleben weitgehend aus der Öffentlichkeit heraus."
  - question: Wo hat Milena Straube studiert?
    answer: "Milena Straube studierte von 2012 bis 2016 an der Hochschule für Musik und Theater Hamburg. Im Abschlussjahr erhielt sie ein Stipendium der Claussen-Simon-Stiftung."
takeaways:
  - "Milena Straube ist seit 2019 als Rebecca Krieger in «Die jungen Ärzte» zu sehen und bringt dabei eine Theaterausbildung vom höchsten Niveau mit — Hamburg, Thalia, Deutsches Schauspielhaus."
  - "2024 gewann sie den Grimme-Preis Spezial für «Haus Kummerveldt» und bewies damit, dass sie weit über die ARD-Vorabendserie hinauswächst."
  - "Privat lebt sie mit Partner Marius Bistritzky und einem Kind in Kassel — bewusst ruhig, weit weg vom Medienbetrieb."
