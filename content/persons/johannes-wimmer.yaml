intro: "Johannes Wimmer ist einer der bekanntesten Ärzte im deutschen Fernsehen — als Doctor Johannes übersetzt er auf YouTube und im TV medizinisches Fachwissen verständlich für ein Millionenpublikum. Der in Hamburg geborene Arzt verbindet klinische Ausbildung am UKE, TV-Formate bei NDR und Sat.1, Bücher auf der SPIEGEL-Bestsellerliste und unternehmerische Projekte im Digital-Health-Bereich zu einem ungewöhnlich breiten Berufsbild."
