intro: "Philipp Hochmair ist einer der vielseitigsten deutschsprachigen Schauspieler seiner Generation — bekannt als Jedermann-Darsteller bei den Salzburger Festspielen, als schräger Kriminalassistent in «Blind ermittelt» und als Sigmund Freud in der Netflix-Serie «Freud». In «Charité» Staffel 3 verkörpert er Prof. Otto Prokop, den forensischen Pathologen der DDR-Charité im Jahr 1961. Der in Wien geborene Österreicher verbindet Hochkultur und Popkultur auf eine Art, die seinesgleichen sucht."
