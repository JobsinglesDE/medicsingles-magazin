intro: "Hendrikje Fitz war von 1998 bis zu ihrem Tod im April 2016 als Physiotherapeutin Pia Heilmann das Herz der ARD-Arztserie «In aller Freundschaft». Die Berliner Schauspielerin entstammte einer Theaterfamilie, stand seit ihren Anfängen auf der Bühne und wurde durch ihre warmherzige, bodenständige Darstellung zu einer der beliebtesten Figuren der Serie. Ihr mutiger Umgang mit ihrer Brustkrebserkrankung berührte Millionen Zuschauer."
