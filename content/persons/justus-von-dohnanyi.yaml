faqItems:
  - question: Wen spielt Justus von Dohnányi in der Charité?
    answer: "In «Charité» Staffel 1 (ARD, 2017) verkörpert Justus von Dohnányi den Bakteriologen Robert Koch. Die erste Staffel spielt im Jahr 1888 an der Berliner Universitätsklinik — Koch ist als Entdecker des Tuberkulose-Erregers bereits weltberühmt und kämpft in der Serie um die Akzeptanz seiner Methoden."
  - question: Aus welcher Familie stammt Justus von Dohnányi?
    answer: "Justus von Dohnányi entstammt einer der prominentesten Künstler- und Intellektuellenfamilien Deutschlands. Sein Vater ist der Dirigent Christoph von Dohnányi, der unter anderem als Chefdirigent des Cleveland Orchestra und des NDR-Elbphilharmonie Orchesters international bekannt wurde. Sein Grossvater Hans von Dohnányi war Jurist und aktiver Widerstandskämpfer gegen das NS-Regime."
  - question: In welchen Kinofilmen war Justus von Dohnányi zu sehen?
    answer: "Justus von Dohnányi spielte in «Schtonk!» (1992, Regie: Helmut Dietl) eine Rolle in der preisgekrönten Satire über die gefälschten Hitler-Tagebücher. Weiterer Kinoerfolg: die Komödienreihe «Männerherzen» (2009) und deren Fortsetzungen sowie «Frau Müller muss weg» (2015), wo er neben Anke Engelke und Ken Duken zu sehen war."
  - question: Wie alt ist Justus von Dohnányi?
    answer: "Justus von Dohnányi wurde am 21. Mai 1960 in München geboren. Er ist damit Jahrgang 1960 und im Jahr 2026 bereits 66 Jahre alt — und weiterhin in Film- und Fernsehproduktionen aktiv."
  - question: Was ist die Charité für eine Serie?
    answer: "«Charité» ist eine ARD-Historienserie, die an der gleichnamigen Berliner Universitätsklinik spielt. Staffel 1 (2017) zeigt den Betrieb im Jahr 1888 mit realen Figuren wie Robert Koch und Rudolf Virchow. Die Serie wurde von Sönke Wortmann produziert und erreichte bei der Erstausstrahlung bis zu 6,5 Millionen Zuschauer."
takeaways:
  - "Justus von Dohnányi bringt als Robert Koch in «Charité» Staffel 1 einen der bedeutendsten Mediziner des 19. Jahrhunderts auf den Bildschirm — nüchtern, überzeugend und ohne historisches Kostümtheater."
  - "Hinter dem Schauspieler steht eine aussergewöhnliche Familiengeschichte: Vater Christoph von Dohnányi ist Weltklassedirigent, Grossvater Hans von Dohnányi starb als Widerstandskämpfer gegen Hitler."
  - "Von «Schtonk!» über «Männerherzen» bis zur Charité — Dohnányi beherrscht das Spektrum von der präzisen Komödie bis zur historischen Figur gleich souverän."
