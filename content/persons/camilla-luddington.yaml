intro: "Camilla Luddington spielt seit Staffel 9 die Chirurgin Dr. Jo Wilson in «Grey's Anatomy» — und hat sich damit einen festen Platz im Grey Sloan Memorial Hospital erspielt. Die britische Schauspielerin, in Ascot (England) aufgewachsen, lebt heute mit Schauspieler Matthew Alan und den gemeinsamen zwei Kindern in Los Angeles."
