faqItems:
  - question: Wer ist Philipp Danne?
    answer: "Philipp Danne ist ein deutscher Schauspieler, geboren am 22. April 1985 in Köln. Er ist bekannt für seine Rolle als Dr. Ben Ahlbeck in «In aller Freundschaft – Die jungen Ärzte», die er seit 2015 spielt."
  - question: Seit wann spielt Philipp Danne in Die jungen Ärzte?
    answer: "Philipp Danne spielt seit dem Start der Spin-off-Serie 2015 den Assistenzarzt Dr. Ben Ahlbeck. Er ist damit von Anfang an mit dabei und gehört bis heute zum Stamm-Cast der ARD/MDR-Serie."
  - question: Ist Philipp Danne verheiratet?
    answer: "Ja. Philipp Danne heiratete 2017 seine langjährige Partnerin Viktoria, geborene Schüßler. Die beiden kennen sich seit etwa 2009 — sind also rund 16 Jahre ein Paar."
  - question: Hat Philipp Danne Kinder?
    answer: "Ja. Im Herbst 2021 kam der gemeinsame Sohn von Philipp und Viktoria Danne zur Welt. Das Paar hält das Privatleben des Kindes bewusst aus der Öffentlichkeit heraus."
  - question: Wo wird Die jungen Ärzte gedreht?
    answer: "Die Serie wird in Leipzig gedreht. Philipp Danne lebt mit seiner Familie jedoch in Köln und pendelt während der Drehblöcke zwischen beiden Städten."
takeaways:
  - "Philipp Danne ist seit 2015 als Dr. Ben Ahlbeck feste Säule von «In aller Freundschaft – Die jungen Ärzte» und prägt das Bild des empathischen Arztes im deutschen TV."
  - "Mit Viktoria führt er seit über 16 Jahren eine stabile, aus der Öffentlichkeit herausgehaltene Beziehung — seit 2017 verheiratet, seit 2021 Eltern."
  - "Das Pendeln zwischen Drehort Leipzig und Wohnort Köln ist für ihn Alltag — ein Rhythmus, den viele im Schicht- und Klinikbetrieb bestens kennen."
