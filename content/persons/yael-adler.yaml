faqItems:
  - question: Wer ist Yael Adler?
    answer: "Dr. med. Yael Adler ist eine deutsche Dermatologin, Phlebologin und Ernährungsmedizinerin mit eigener Privatpraxis in Berlin-Grunewald. Sie wurde am 17. Juli 1973 in Frankfurt am Main geboren, promovierte 1999 und ist seit 2003 als Gesundheitsexpertin im TV präsent. Bekannt wurde sie einem breiten Publikum durch fünf Spiegel-Bestseller beim Drömer Knaur Verlag — von «Haut nah» (2016) bis «Genial ernährt!» (2025)."
  - question: Welche Bücher hat Yael Adler geschrieben?
    answer: "Yael Adler hat fünf Spiegel-Bestseller veröffentlicht, alle bei Drömer Knaur: «Haut nah» (2016), «Darüber spricht man nicht» (2018), «Wir müssen reden, Frau Doktor!» (2020), «Genial vital!» (2023) und «Genial ernährt!» (2025). Hörbuch-Ausgaben erscheinen beim Argon Verlag."
  - question: Wer ist der Mann von Yael Adler?
    answer: "Yael Adler ist mit dem Berliner Zahnarzt Elio Adler verheiratet, der eine eigene Praxis in Berlin führt. Das Paar hat zwei Kinder. Nähere Details zu Familienstand und Kindern hält Yael Adler bewusst privat."
  - question: Wo praktiziert Yael Adler als Dermatologin?
    answer: "Yael Adler betreibt seit 2007 eine dermatologische Privatpraxis in Berlin-Grunewald mit Schwerpunkten Hauterkrankungen, Venenleiden, Lasermedizin und Ästhetik. Seit 2024 hat sie zusätzlich einen Standort an der Clinic Utoquai in Zürich."
  - question: In welchen TV-Sendungen ist Yael Adler zu sehen?
    answer: "Yael Adler ist seit 2003 als TV-Gesundheitsexpertin etabliert — bei ARD-Buffet, ZDF Volle Kanne, im ZDF-Fernsehgarten, im Sat.1-Frühstücksfernsehen sowie bei RTL und ProSieben. Sie produziert außerdem den Podcast «Ist das noch gesund?» und schreibt seit 2017 eine Kolumne in der Frankfurter Allgemeinen Sonntagszeitung."
takeaways:
  - "Yael Adler verbindet seit über 15 Jahren ärztliche Praxis, fünf Spiegel-Bestseller und TV-Präsenz — ein Modell aus Substanz und Reichweite, das in Deutschland selten ist."
  - "Mit Themen wie Intimhaut, Verdauung und Longevity bricht sie Tabus, die andere Fachärztinnen meiden — und schafft damit ein Millionenpublikum, ohne die klinische Glaubwürdigkeit zu verlieren."
  - "Ihr Privatleben schützt sie konsequent: verheiratet mit Zahnarzt Elio Adler, zwei Kinder, klare Grenze zwischen öffentlicher Rolle und Familienleben."
