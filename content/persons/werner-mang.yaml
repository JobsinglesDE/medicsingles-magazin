faqItems:
  - question: Wer ist Werner Mang?
    answer: "Werner Mang (geb. 4. September 1949) ist ein deutscher Schönheitschirurg und Gründer der Bodenseeklinik in Lindau. Er ist bekannt als «Gesichtschirurg der Reichen und Schönen» und hat sich durch seine Arbeit an Prominenten einen Namen gemacht. Vor etwa drei Jahren übergab er die klinische Leitung der Klinik an seine Tochter Gloria."
  - question: Ist Werner Mang noch als Chirurg tätig?
    answer: "Werner Mang operiert nach der Übergabe der Bodenseeklinik an seine Tochter Gloria kaum noch. Er widmet sich Pilgerreisen auf dem Camino de Santiago, gelegentlichen öffentlichen Auftritten und seinem Glaubensleben."
  - question: Was meint Werner Mang mit «innerlich zufrieden werden»?
    answer: "Werner Mang beschreibt die Aufgabe des Schönheitschirurgen nicht primär als ästhetische Arbeit, sondern als Entlastung: «Ich nehme den Menschen Druck, damit sie innerlich zufrieden werden. Das ist die Grundlage für ein erfülltes Leben.» Diese Haltung zieht sich durch sein gesamtes Berufsbild."
  - question: Was hat Werner Mang im Februar 2026 gemacht?
    answer: "Werner Mang hielt am 18. Februar 2026 eine Fastenpredigt in der Wallfahrtskirche auf dem Berg Bussen in Oberschwaben — dem «Heiligen Berg Oberschwabens». Er wählte die Bergpredigt als Leitmotiv und sprach über innere Zufriedenheit als Grundlage eines erfüllten Lebens."
takeaways:
  - "Werner Mang gründete die Bodenseeklinik in Lindau und prägte als «Gesichtschirurg der Reichen und Schönen» jahrzehntelang die deutsche Schönheitschirurgie."
  - "Er hat die Klinikleitung an Tochter Gloria übergeben und sucht heute auf dem Camino de Santiago und der Kirchenkanzel neue Bedeutung jenseits des OP."
  - "Im Februar 2026 predigte er auf dem Berg Bussen — ein ungewöhnlicher Auftritt, der zeigt, wie eng Berufsethos und Glaube bei ihm verbunden sind."
