intro: "Kevin McKidd verkörpert seit 2008 den kompromisslosen Militärarzt Dr. Owen Hunt in «Grey's Anatomy» — und wurde über die Jahre auch hinter der Kamera aktiv: Als Regisseur inszenierte er zahlreiche Episoden der Serie. Nach 17 Staffeln verließ der schottische Schauspieler im Mai 2026 die Serie. Auf dem Bildschirm wie dahinter hinterliess er einen bleibenden Eindruck."
