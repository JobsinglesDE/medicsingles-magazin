faqItems:
  - question: Wen spielt Jannik Schümann in der Serie «Charité»?
    answer: "In der zweiten Staffel von «Charité» (ARD/Netflix, 2019) spielt Jannik Schümann den fiktiven Charakter Otto Marquardt — einen 24-jährigen Medizinstudenten, der im Kriegsjahr 1943 vom Front-Einsatz zurückkehrt, um sein Studium an der Berliner Charité fortzuführen. Otto ist das moralische Gewissen der Staffel: Er erkennt früh, wohin die NS-Medizin führt."
  - question: Wie alt ist Jannik Schümann?
    answer: "Jannik Schümann wurde am 22. Juli 1992 in Hamburg-Kirchwerder geboren. Er ist damit im Jahr 2026 33 Jahre alt."
  - question: Hat Jannik Schümann sich geoutet?
    answer: "Ja. Im Dezember 2020 veröffentlichte Jannik Schümann auf Instagram ein Foto mit seinem Partner Felix Kruck — ein Schritt, den er selbst weniger als klassisches Coming-out verstand, sondern als Zeichen der Solidarität mit der queeren Community. Seinen Eltern hatte er bereits 2011 von seiner Homosexualität erzählt."
  - question: Wer ist Felix Kruck, Jannik Schümanns Partner?
    answer: "Felix Kruck ist Yoga-Lehrer und lebt in Berlin. Das Paar war laut Aussagen Schümanns bereits seit etwa zwei Jahren zusammen, als er im Dezember 2020 das erste gemeinsame Foto veröffentlichte."
  - question: Welche anderen Serien und Filme hat Jannik Schümann gedreht?
    answer: "Jannik Schümann wurde bundesweit bekannt durch «Sisi» (ZDF/ORF, ab 2021), in der er Kaiser Franz Joseph I. spielt. Weitere Rollen: «Homevideo» (2011, New Faces Award Nominierung), «Center of My World» (2016), «Tribes of Europa» (Netflix, 2021) und «Die Diplomatin» (ARD). Drei Jupiter Awards als Bester Schauspieler (2020–2022) belegen seine Anerkennung beim Publikum."
takeaways:
  - "Jannik Schümann verkörpert Otto Marquardt in «Charité» Staffel 2 — einen Medizinstudenten im Nazi-Deutschland, der als stilles moralisches Gewissen der Serie fungiert."
  - "Als Kaiser Franz Joseph I. in «Sisi» wurde er 2021 einem Millionenpublikum bekannt und gewann dreimal den Jupiter Award als Bester Schauspieler."
  - "Sein öffentliches Coming-out im Dezember 2020 verstand er als Statement für die queere Community — nicht als Geheimnis-Lüften, denn seiner Familie hatte er die Wahrheit schon 2011 gesagt."
