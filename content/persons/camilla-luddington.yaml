faqItems:
  - question: Wie alt ist Camilla Luddington?
    answer: "Camilla Luddington wurde am 15. Dezember 1983 in Ascot, England geboren. Im Jahr 2026 ist sie 42 Jahre alt."
  - question: Wer ist Dr. Jo Wilson in Grey's Anatomy?
    answer: "Dr. Jo Wilson ist eine Chirurgin am fiktiven Grey Sloan Memorial Hospital in Seattle. Seit Staffel 9 (2012) ist sie Teil des Hauptcasts — zunächst als Assistenzärztin, später als vollwertige Chirurgin. Ihre Figur durchlebt eine schwierige Vorgeschichte als Heimkind und kämpft sich über die Staffeln hinweg zu einem stabilen Leben vor."
  - question: Ist Camilla Luddington mit Matthew Alan verheiratet?
    answer: "Camilla Luddington und Schauspieler Matthew Alan sind seit 2017 verlobt. Das Paar ist nicht standesamtlich verheiratet, lebt aber seit Jahren zusammen und hat zwei gemeinsame Kinder: Tochter Hayden (2017) und Sohn Lucas (2021)."
  - question: Hat Camilla Luddington Lara Croft gespielt?
    answer: "Ja. Camilla Luddington lieh der Videospielheldin Lara Croft im Reboot «Tomb Raider» (2013) und im Nachfolger «Rise of the Tomb Raider» (2015) ihre Stimme und ihr Bewegungsprofil per Motion Capture. Damit ist sie eine der bekanntesten Lara-Croft-Interpretinnen der Spielgeschichte."
  - question: Seit wann ist Camilla Luddington bei Grey's Anatomy?
    answer: "Camilla Luddington ist seit Staffel 9 fester Bestandteil von «Grey's Anatomy», die im Herbst 2012 ausgestrahlt wurde. Seitdem gehört sie ununterbrochen zum Hauptcast der Serie."
takeaways:
  - "Camilla Luddington verkörpert seit Staffel 9 Dr. Jo Wilson und gehört damit zu den am längsten durchgehend aktiven Hauptdarstellerinnen der Gegenwart von «Grey's Anatomy»."
  - "Als einzige Britin im laufenden Hauptcast bringt sie einen unverwechselbaren Hintergrund mit — von LAMDA in London bis zum Grey Sloan Memorial Hospital in Seattle."
  - "Abseits der Kamera ist sie als Mutter zweier Kinder und Partnerin von Schauspieler Matthew Alan fest im Alltag verankert — und als Lara Croft auch Videospiel-Fans ein Begriff."
