intro: "Roy Peter Link spielte von 2015 bis 2019 als Dr. Niklas Ahrend in «In aller Freundschaft – Die jungen Ärzte» eine der beliebtesten Gründungsrollen der ARD-Serie. Der Kölner Schauspieler wurde zuvor durch «Anna und die Liebe» bekannt. Nach seinem Ausstieg zog er mit seiner Ehefrau nach Guinea-Bissau in Westafrika und hält sich seither aus dem deutschen Showgeschäft weitgehend heraus."
