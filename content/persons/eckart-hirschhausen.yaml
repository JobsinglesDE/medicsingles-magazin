intro: "Eckart von Hirschhausen ist Arzt, Kabarettist und Stifter — und damit einer der wenigen deutschen Mediziner, der Wissenschaft und Unterhaltung so verbindet, dass beide Seiten davon profitieren. Mit seiner Stiftung Gesunde Erde Gesunde Menschen und mehreren Millionen verkauften Büchern hat er sich weit über den Fernsehbetrieb hinaus verankert."
