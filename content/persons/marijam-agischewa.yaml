faqItems:
  - question: Wer ist Marijam Agischewa?
    answer: "Marijam Agischewa ist eine deutsche Schauspielerin, bürgerlich Melan Schwarz, geboren am 22. Dezember 1958 in Hangzhou, China. Seit Januar 2015 spielt sie Prof. Dr. Karin Patzelt in «In aller Freundschaft – Die jungen Ärzte» (ARD/MDR)."
  - question: Welche Rolle spielt Marijam Agischewa in «Die jungen Ärzte»?
    answer: "Marijam Agischewa spielt Prof. Dr. Karin Patzelt, die Chefärztin des Johannes-Thal-Klinikums in «In aller Freundschaft – Die jungen Ärzte». Sie gehört seit der ersten Folge im Januar 2015 zum Stamm-Cast der Serie."
  - question: Woher kommt Marijam Agischewa wirklich?
    answer: "Marijam Agischewa wurde 1958 in Hangzhou, China geboren. Ihr Vater Ernst Schwarz war ein österreichischer Sinologe, der 1938 vor den Nationalsozialisten nach Shanghai geflohen war. Als Kleinkind zog sie mit der Familie in die DDR, wo ihr Vater an der Humboldt-Universität lehrte."
  - question: Wie heißt Marijam Agischewa bürgerlich?
    answer: "Marijam Agischewa heißt bürgerlich Melan Schwarz. Der Vorname Melan stammt aus dem Chinesischen und bedeutet in etwa «Welle der Pflaumenblüten». Den Künstlernamen Agischewa leitete sie vom Nachnamen ihrer Mutter Amina Agischewa ab, die Tatarin war."
  - question: Hat Marijam Agischewa Kinder?
    answer: "Ja. Marijam Agischewa hat eine Tochter namens Olivia, geboren 1987, aus ihrer ersten Ehe mit dem Schauspieler Wolfgang Häntsch. Seit 1995 ist sie mit Georg Alexander verheiratet."
  - question: Warum verließ Marijam Agischewa die DDR?
    answer: "1989 reiste Marijam Agischewa mit einer genehmigten US-Reise aus der DDR aus und kehrte nicht zurück. Sie hat später gesagt, die DEFA-Filme hätten sich zunehmend von der Realität entfernt; das Filmmachen habe seinen Reiz verloren."
takeaways:
  - "Marijam Agischewa wurde 1958 in Hangzhou, China geboren und wuchs in der DDR auf — ihr Vater Ernst Schwarz war Wiener Sinologe, der 1938 vor Hitler nach Shanghai geflohen war."
  - "Seit Januar 2015 spielt sie Prof. Dr. Karin Patzelt in «In aller Freundschaft – Die jungen Ärzte» — eine der markantesten Chefarzt-Figuren im deutschen Serienfernsehen."
  - "Neben der Schauspielerei arbeitet sie seit 2006 als Heilpraktikerin für Psychotherapie in Berlin — eine Verknüpfung, die zum Medizin-Universum der Serie passt."
