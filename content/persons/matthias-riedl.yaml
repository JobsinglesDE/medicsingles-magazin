faqItems:
  - question: "Wer ist Matthias Riedl?"
    answer: "Matthias Riedl ist ein deutscher Facharzt für Innere Medizin mit Schwerpunkten Ernährungsmedizin und Diabetologie. Geboren am 6. Oktober 1962 in Ütersen bei Pinneberg, studierte er ab 1982 Medizin an der Universität Hamburg und legte 1989 das Dritte Staatsexamen ab. Er ist Gründer und ärztlicher Leiter des Medicum Hamburg und seit 2014 als E-Doc der NDR-Sendung Die Ernährungs-Docs bekannt."
  - question: "Welche TV-Sendungen macht Matthias Riedl?"
    answer: "Matthias Riedl ist seit 2014 E-Doc der NDR-Sendung Die Ernährungs-Docs, die er konzeptionell mitentwickelt hat. Seit Januar 2026 läuft auf 3sat das Kochformat Iss besser! Mit dem Ernährungs-Doc, in dem er gemeinsam mit Moderator Tarik Rose kocht und den medizinischen Hintergrund der Gerichte erklärt. Darüber hinaus moderiert er das NDR-Kochformat Iss Dich gesund mit dem Ernährungsdoc."
  - question: "Was ist das Medicum Hamburg?"
    answer: "Das Medicum Hamburg ist ein medizinisches Versorgungszentrum (MVZ), das Matthias Riedl 2007 gegründet hat. Nach eigenen Angaben handelt es sich um eines der größten interdisziplinären Versorgungszentren Europas. Das Haus vereint Diabetologie, Ernährungsmedizin, Kardiologie und weitere Fachgebiete. Es gehört zum Asklepios-Verbund und ist akademische Lehrpraxis der Universität Hamburg und der Asklepios Medical School."
  - question: "Welche Bücher hat Matthias Riedl geschrieben?"
    answer: "Zu seinen bekanntesten Titeln gehören 100 Fragen zu Diabetes Typ 2 (2008), Das 20:80-Prinzip (Gräfe und Unzer, 2017) und Schlank mit System. Seit 2016 erscheint beim ZS Verlag die Ernährungs-Docs-Reihe, die er gemeinsam mit den anderen Docs verantwortet. In jüngerer Zeit kam Iss klüger, nicht weniger hinzu. Sein Konzept: Ernährungsmedizin ohne Alles-oder-nichts-Anspruch, alltagstauglich erklärt."
  - question: "Wie hoch ist das Vermögen von Matthias Riedl?"
    answer: "Es gibt keine offiziell bestätigte Zahl. Matthias Riedl äußert sich dazu nicht öffentlich, und seriöse Quellen nennen keinen belegten Betrag. Belegbar sind die Einnahmequellen: das Medicum Hamburg, zahlreiche Bestseller-Ratgeber, die NDR-Sendung Die Ernährungs-Docs, Podcast, Zeitschrift und die App myFoodDoctor. Kursierende Net-Worth-Schätzungen stammen ohne Quellenangabe und sollten nicht als Fakt gelten."
takeaways:
  - "Matthias Riedl ist Internist, Diabetologe und Ernährungsmediziner — kein Lifestyle-Berater, sondern ein ausgebildeter Facharzt mit klinischer Tiefe."
