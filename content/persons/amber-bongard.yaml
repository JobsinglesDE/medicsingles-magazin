faqItems:
  - question: Wer ist Amber Bongard?
    answer: "Amber Bongard ist eine deutsche Schauspielerin, geboren am 24. August 1997 in Potsdam. Bekannt wurde sie als Fanny Schleicher in den Ostwind-Filmen (2013–2020) und als Ricarda Bundschuh in der ZDF-Reihe «Familie Bundschuh». In «Die jungen Ärzte» Staffel 12 spielt sie die Patientin Luna Roos."
  - question: Welche Rolle spielt Amber Bongard in «Die jungen Ärzte»?
    answer: "Amber Bongard spielt Luna Roos, eine Patientin in Staffel 12 von «Die jungen Ärzte» (ARD/MDR). Ihr Fall löst eine emotionale Suchaktion aus und fordert das Team am Johannes-Thal-Klinikum in Erfurt heraus."
  - question: Woher kennt man Amber Bongard?
    answer: "Die meisten kennen Amber Bongard als Fanny Schleicher aus den Ostwind-Filmen, in denen sie von 2013 bis 2020 als beste Freundin der Hauptfigur Mia zu sehen war. Dazu kommt die ZDF-Reihe «Familie Bundschuh», «Charité» (ARD, 2021) und «Tonis Welt» (ARD)."
  - question: Wie alt ist Amber Bongard?
    answer: "Amber Bongard wurde am 24. August 1997 in Potsdam geboren und ist 2026 28 Jahre alt."
  - question: Was weiß man über Amber Bongard privat?
    answer: "Amber Bongard hält ihr Privatleben konsequent aus der Öffentlichkeit. Zu Beziehungen oder Wohnort äußert sie sich nicht. Ihre Mutter Katrin Bongard ist Bildkünstlerin und Autorin. Amber engagiert sich für die Kinderrechtsorganisation Plan International."
takeaways:
  - "Amber Bongard (geb. 1997, Potsdam) wurde durch die Ostwind-Filme als Fanny Schleicher bekannt — von 2013 bis 2020 in allen fünf Teilen der beliebten Pferdefilm-Reihe dabei."
  - "In «Die jungen Ärzte» Staffel 12 zeigt sie sich in einer anderen, erwachseneren Rolle: als Patientin Luna Roos, deren Fall das Klinikteam in Erfurt auf eine harte Probe stellt."
  - "Privates hält sie bewusst aus den Medien heraus — ihr Fokus liegt auf der Arbeit und ihrem Engagement für Kinderrechte bei Plan International."
