intro: "Uwe Ochsenknecht gehört zu den vielseitigsten deutschen Schauspielern seiner Generation — bekannt durch Kultfilme wie «Das Boot» und «Schtonk!», gefeiert als Komödiant in «Männerpension» und zuletzt zu sehen als Chirurgieprofessor Prof. Helmut Kraatz in der Historienserie «Charité» Staffel 3. Sein Werk umspannt vier Jahrzehnte, seine Energie ist bis heute ungebrochen."
