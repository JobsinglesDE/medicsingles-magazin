intro: "Andrea Kathrin Loewig ist seit 1999 das Gesicht der ARD-Erfolgsserie «In aller Freundschaft» — als Oberärztin Dr. Kathrin Globisch in der Sachsenklinik Leipzig gehört sie zu den bekanntesten TV-Ärztinnen Deutschlands. Die in Merseburg geborene Schauspielerin absolvierte ihre Ausbildung an der Hochschule für Schauspielkunst «Ernst Busch» in Berlin und blickt auf eine Karriere zurück, die tief in der ostdeutschen Theatertradition verwurzelt ist. Privat lebt sie mit ihrem Ehemann Andreas Thiele und ihrer Tochter in Berlin."
