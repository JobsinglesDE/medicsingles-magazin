faqItems:
  - question: Wer spielt Anni Waldhausen in «Charité» Staffel 2?
    answer: "Anni Waldhausen wird in «Charité» Staffel 2 von Mala Emde gespielt. Die Frankfurterin verkörpert die junge Ärztin, die 1943 an der Berliner Charité inmitten des Zweiten Weltkriegs und der NS-Diktatur ihren eigenen moralischen Weg sucht."
  - question: Wie alt ist Mala Emde?
    answer: "Mala Emde wurde am 9. September 1995 in Frankfurt am Main geboren. Sie ist damit Jahrgang 1995 und im Jahr 2026 30 Jahre alt."
  - question: Welchen Deutschen Filmpreis gewann Mala Emde?
    answer: "Mala Emde erhielt 2021 den Deutschen Filmpreis in der Kategorie Beste weibliche Nebenrolle für ihre Darstellung der Luisa in «Und morgen die ganze Welt» (Regie: Julia von Heinz, 2020). Der Film behandelt den Kampf junger Menschen gegen den erstarkenden Rechtsextremismus."
  - question: Was war Mala Emdes Durchbruch?
    answer: "Ihr Durchbruch gelang Mala Emde 2018 mit dem Roadmovie «303» von Hans Weingartner, in dem sie die Studentin Jule spielt, die auf einer Reise nach Portugal einen jungen Mann trifft. Der Film war ein kritischer und kommerzieller Erfolg und etablierte sie als eine der markantesten jungen Gesichter des deutschen Kinos."
  - question: Wo hat Mala Emde Schauspiel studiert?
    answer: "Mala Emde studierte an der renommierten Hochschule für Schauspielkunst Ernst Busch in Berlin und schloss ihr Studium 2019 ab — im selben Jahr lief «Charité» Staffel 2 mit ihr in der Hauptrolle im Ersten."
  - question: Was spielt Mala Emde in der Charité?
    answer: "In «Charité» Staffel 2 spielt Mala Emde die junge Ärztin Anni Waldhausen, die ihr medizinisches Examen bei Professor Sauerbruch ablegt. Die Handlung der zweiten Staffel ist in der Berliner Charité im Jahr 1943 angesiedelt — mitten im Zweiten Weltkrieg, unter der ständigen Bedrohung durch das NS-Regime. Anni steht stellvertretend für die vielen jungen Ärztinnen, die in dieser Zeit zwischen Karriere, Familie und ideologischem Druck täglich Gewissenskonflikte meistern mussten."
takeaways:
  - "Mala Emde ist eine der prägnantesten deutschen Schauspielerinnen ihrer Generation — mit dem Deutschen Filmpreis 2021 im Gepäck und einer Bandbreite von der Historien-Dramaturgie der «Charité» bis zum politisch aufgeladenen Gegenwartskino."
  - "Als junge Ärztin Anni Waldhausen in «Charité» Staffel 2 gibt Emde einer Generation junger Frauen im Zweiten Weltkrieg ein Gesicht — authentisch, ohne Pathos, ohne Schwarz-Weiß-Denken."
  - "Ihr Filmdebüt «303» und «Und morgen die ganze Welt» zeigen, dass Mala Emde Figuren mit echtem inneren Konflikt sucht — eine Qualität, die in der deutschen Filmlandschaft selten und deshalb umso wertvoller ist."
