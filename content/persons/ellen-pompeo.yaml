faqItems:
  - question: Wie alt ist Ellen Pompeo?
    answer: "Ellen Pompeo wurde am 10. November 1969 in Everett, Massachusetts geboren. Sie ist damit Jahrgang 1969 und im Jahr 2026 56 Jahre alt."
  - question: Ist Ellen Pompeo noch bei Grey's Anatomy dabei?
    answer: "Ja, aber in reduziertem Umfang. Seit Staffel 19 tritt Ellen Pompeo nur noch in ausgewählten Folgen auf — in Staffel 22 (Start Oktober 2025) in rund sieben Episoden. Als Erzählerin der Serie und Executive Producer bleibt sie durchgehend präsent."
  - question: Wer ist Ellen Pompeos Ehemann?
    answer: "Ellen Pompeo ist seit 2007 mit dem Musikproduzenten Chris Ivery verheiratet. Das Paar lernte sich 2003 in einem Supermarkt in Los Angeles kennen und ist seit über zwanzig Jahren zusammen."
  - question: Hat Ellen Pompeo Kinder?
    answer: "Ellen Pompeo und Chris Ivery haben drei Kinder: Tochter Stella (geboren 2009), Tochter Sienna (geboren 2014 per Leihmutterschaft) und Sohn Eli (geboren 2016)."
  - question: Seit wann spielt Ellen Pompeo die Meredith Grey?
    answer: "Ellen Pompeo spielt Dr. Meredith Grey seit dem Serienstart von «Grey's Anatomy» im März 2005 — über 20 Staffeln und damit eine der langlebigsten Hauptrollen im US-Fernsehen."
takeaways:
  - "Ellen Pompeo ist seit 2005 als Dr. Meredith Grey die zentrale Figur von «Grey's Anatomy» und prägte das Bild der modernen Serien-Ärztin wie keine zweite."
  - "Seit Staffel 19 tritt sie bewusst kürzer, bleibt als Erzählerin und Executive Producer aber das Herz der Serie."
  - "Privat lebt sie bodenständig mit Musikproduzent Chris Ivery und den gemeinsamen drei Kindern — eine seltene Beständigkeit in Hollywood."
