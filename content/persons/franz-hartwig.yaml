intro: "Franz Hartwig ist einer der vielseitigsten deutschen Schauspieler seiner Generation — bekannt durch den Grimme-Preis für «Der Pass» und als Chirurg Dr. Curt Bruncken in der ARD-Serie «Charité» (Staffel 3, 2021). Der gebürtige Dresdner wurde an der Schaubühne Berlin groß und pendelt seither souverän zwischen anspruchsvollem Theater, Kinofilm und hochkarätigem Fernsehen."
