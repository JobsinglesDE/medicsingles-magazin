intro: "Thomas Rühmann ist seit dem Serienstart am 26. Oktober 1998 das Gesicht von «In aller Freundschaft» — als Dr. Roland Heilmann wurde er zur bekanntesten TV-Ärztefigur im deutschen Fernsehen. Der gebürtige Osterburger ist neben seiner Schauspielkarriere leidenschaftlicher Musiker und Theatermacher. Privat lebt er mit seiner Familie in Leipzig."
