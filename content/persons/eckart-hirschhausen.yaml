faqItems:
  - question: Wann und wo wurde Eckart von Hirschhausen geboren?
    answer: "Eckart von Hirschhausen wurde am 25. August 1967 in Frankfurt am Main geboren. Er stammt aus einer deutsch-baltischen Gelehrtenfamilie, die 1835 in den russischen Adel erhoben wurde."
  - question: Welche TV-Formate moderiert Eckart von Hirschhausen?
    answer: "Seit 2014 moderiert er «Hirschhausens Quiz des Menschen» in der ARD. 2017 startete «Hirschhausen im…», seit 2021 läuft «Wissen vor Acht, Erde». Die ARD-Dokumentation «Hirschhausen und die Deepfake-Mafia» lief am 4. Mai 2026."
  - question: Was ist die Stiftung Gesunde Erde Gesunde Menschen?
    answer: "Eckart von Hirschhausen gründete die Stiftung im März 2020. Sie verbindet Klima- und Gesundheitsschutz auf wissenschaftlicher Basis und sieht den Klimawandel als größte Gesundheitsgefahr des 21. Jahrhunderts. Förderer sind die Bill-und-Melinda-Gates-Foundation und die Stiftung Mercator."
  - question: Ist Eckart von Hirschhausen verheiratet?
    answer: "Hirschhausen hat öffentlich erklärt, glücklich liiert zu sein. Namen, Details oder bestätigte Kinder sind in seriösen Quellen nicht dokumentiert — sein erklärtes Prinzip ist, das Privatleben konsequent zu schützen."
  - question: Welche Auszeichnungen hat Eckart von Hirschhausen erhalten?
    answer: "Unter anderem den Deutschen Umwelt-Medienpreis 2020, den Georg von Holtzbrinck Preis für Wissenschaftsjournalismus 2022, den Hans-Carl-von-Carlowitz-Nachhaltigkeitspreis 2023, den Oberhummer Award 2025 und die Goldene Tanne der Schutzgemeinschaft Deutscher Wald, verliehen am 17. April 2026 in Berlin."
takeaways:
  - "Eckart von Hirschhausen verbindet ärztliche Ausbildung, Bühnenkabarett und Stiftungsarbeit — Promotion 1994, Solo-Debüt 2001, Stiftungsgründung 2020."
  - "Seine Bücher «Die Leber wächst mit ihren Aufgaben» und «Glück kommt selten allein…» verkauften sich zusammen über fünf Millionen Mal und machten ihn zum erfolgreichsten deutschen Sachbuchautor seiner Generation."
  - "Mit der Stiftung Gesunde Erde Gesunde Menschen und Formaten wie «Hirschhausens Quiz des Menschen» trägt er das Konzept der Planetaren Gesundheit in die Breite."
