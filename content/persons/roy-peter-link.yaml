faqItems:
  - question: Wann und wo wurde Roy Peter Link geboren?
    answer: "Roy Peter Link wurde am 9. Juni 1982 in Köln geboren. Aufgewachsen ist er in Ahaus-Wessum im Münsterland, einem Ortsteil nahe der niederländischen Grenze. Stand Juni 2026 ist er 43 Jahre alt."
  - question: Welche Rolle spielte Roy Peter Link bei «Die jungen Ärzte»?
    answer: "Roy Peter Link verkörperte von der ersten Folge im Jahr 2015 bis zu seinem Ausstieg 2019 den Assistenzarzt Dr. Niklas Ahrend. Er gehörte damit zum Gründungs-Hauptcast der ARD-Serie «In aller Freundschaft – Die jungen Ärzte»."
  - question: Warum stieg Roy Peter Link bei «Die jungen Ärzte» aus?
    answer: "Roy Peter Link verließ die Serie 2019 nach vier Jahren als Hauptdarsteller. Er äußerte in Interviews den Wunsch nach einer grundlegenden Veränderung und Abstand vom deutschen Fernsehbetrieb. Konkrete neue Rollen übernahm er danach nicht mehr."
  - question: Wo lebt Roy Peter Link heute?
    answer: "Roy Peter Link lebt seit seinem Ausstieg aus «Die jungen Ärzte» mit seiner Ehefrau in Guinea-Bissau, einem kleinen Land an der Westküste Afrikas. Er hat sich aus dem deutschen Showbusiness praktisch vollständig zurückgezogen."
  - question: Ist Roy Peter Link auf Instagram aktiv?
    answer: "Roy Peter Link hat einen Instagram-Account unter @roy_peter_link mit rund 42.000 Followern. Seit Sommer 2021 postet er nur noch sehr sporadisch — meist Schnappschüsse aus Westafrika oder von Reisen. Werbepartnerschaften oder aktives Markenbuilding betreibt er nicht."
takeaways:
  - "Roy Peter Link war von 2015 bis 2019 als Dr. Niklas Ahrend Teil des Gründungs-Hauptcasts von «In aller Freundschaft – Die jungen Ärzte» und wurde zu einem der beliebtesten Charaktere der Serie."
  - "Nach seinem Ausstieg zog er mit seiner Ehefrau nach Guinea-Bissau in Westafrika — ein radikaler Schritt, der in der deutschen Schauspielbranche nahezu einzigartig ist."
  - "Seither ist Roy Peter Link öffentlich kaum mehr in Erscheinung getreten und hat sich auf Instagram seit 2021 weitgehend zurückgezogen."
