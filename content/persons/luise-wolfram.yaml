intro: "Luise Wolfram gehört zu den beständigsten deutschen Schauspielerinnen ihrer Generation. Als BKA-Ermittlerin Linda Selb im Bremer «Tatort» ist sie seit 2016 festes Gesicht der ARD-Krimireihe. In der Historieserie «Charité» verkörperte sie in der zweiten Staffel die reale Figur Margot Sauerbruch — eigenwillige Medizinstudentin, spätere OR-Assistentin und Ehefrau des legendären Chirurgen Ferdinand Sauerbruch, gespielt von Ulrich Noethen. Die Thüringerin startete als Kinderschauspielerin und studierte später an der renommierten Ernst-Busch-Hochschule in Berlin."
