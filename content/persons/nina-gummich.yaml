intro: "Nina Gummich übernahm 2021 als Dr. Ella Wendt die Staffelhauptrolle in der dritten Staffel von «Charité» — und spielte damit eine junge Ärztin mitten in der Nachkriegszeit des Jahres 1961, die zwischen Ost und West zerrissen wird. Die 1991 in Halle geborene Schauspielerin stammt aus einer Theaterfamilie, studierte an der HMT Leipzig und ist heute eine der gefragtesten deutschen Fernsehjungdarstellerinnen — von der Rechtsmedizinerin im «Thüringenkrimi» bis zur jungen Alice Schwarzer im ARD-Zweiteiler."
