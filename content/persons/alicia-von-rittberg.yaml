faqItems:
  - question: Wer ist Alicia von Rittberg?
    answer: "Alicia Gräfin von Rittberg ist eine deutsche Schauspielerin, geboren am 10. Dezember 1993 in München. Sie wurde einem breiten Publikum bekannt als Ida Lenze — die Hauptrolle in der ARD-Historienserie «Charité» (Staffel 1, 2017). Für diese Rolle erhielt sie den Bambi 2017. Seither ist sie auch international tätig, zuletzt als Elizabeth Tudor in «Becoming Elizabeth» (Starz, 2022)."
  - question: Wen spielt Alicia von Rittberg in Charité?
    answer: "Alicia von Rittberg spielt Ida Lenze, eine junge Frau aus ärmlichen Verhältnissen, die Ende des 19. Jahrhunderts als Pflegerin an der Berliner Charité arbeitet — und den Traum hegt, selbst Ärztin zu werden. Die Figur ist fiktiv, aber in das historische Umfeld der Charité um 1888 eingebettet, als Pioniere wie Robert Koch und Emil von Behring dort forschten."
  - question: Hat Alicia von Rittberg den Bambi gewonnen?
    answer: "Ja. Alicia von Rittberg erhielt den Bambi 2017 in der Kategorie Deutsche Schauspielerin — ausgezeichnet für ihre Hauptrolle als Ida Lenze in der ARD-Serie «Charité». Es war einer ihrer ersten großen Preise und machte sie auch über die Stammzuschauer der ARD hinaus bekannt."
  - question: Was hat Alicia von Rittberg nach Charité gedreht?
    answer: "Nach «Charité» baute Alicia von Rittberg ihre internationale Karriere weiter aus. Bereits 2014 hatte sie in Brad Pitts Kriegsfilm «Fury» mitgespielt, 2016 folgte «Our Kind of Traitor» und eine Rolle als Prinzessin Cecilie in «The Crown» (Staffel 1, Netflix). 2022 übernahm sie die Titelrolle als junge Elizabeth Tudor in der Starz-Serie «Becoming Elizabeth» — acht Episoden als englische Königin im Werden."
  - question: Wo kommt Alicia von Rittberg her?
    answer: "Alicia von Rittberg stammt aus München und wuchs dort mit drei Brüdern auf. Ihr Name verweist auf eine ehemals adlige Familie, doch aufgewachsen ist sie ganz normal in Bayern. Neben ihrer Schauspielausbildung studierte sie Corporate Management & Economics an der Zeppelin Universität in Friedrichshafen."
takeaways:
  - "Alicia von Rittberg ist das Gesicht der ersten «Charité»-Staffel: Als Pflegerin Ida Lenze, die 1888 an Berlins bekanntestem Krankenhaus gegen Standesschranken kämpft, gewann sie den Bambi 2017 und machte die Historienserie zum Quotenerfolg."
  - "Ihre Karriere ist zweisprachig: In Deutschland bekannt durch «Charité», ist sie international durch Rollen in «Fury», «The Crown», «Our Kind of Traitor» und «Becoming Elizabeth» präsent — eine der wenigen deutschen Schauspielerinnen, die Hollywood und ARD gleichzeitig bedienen."
  - "Sie begann ihre Karriere als Studentin der Wirtschaftswissenschaften an der Zeppelin Universität — Schauspielerin und Akademikerin zugleich, beides ernsthaft verfolgt."
