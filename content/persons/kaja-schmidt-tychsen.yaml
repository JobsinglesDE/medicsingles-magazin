faqItems:
  - question: Wer ist Kaja Schmidt-Tychsen?
    answer: "Kaja Schmidt-Tychsen ist eine deutsche Schauspielerin, geboren am 21. Mai 1981 in Flensburg. Sie studierte Schauspiel an der Hochschule für Musik und Theater Rostock und spielte von 2011 bis 2025 vierzehn Jahre lang die Jennifer Zadek in der RTL-Soap «Alles was zählt». Seit April 2026 ist sie in der ARD-Serie «In aller Freundschaft – Die jungen Ärzte» zu sehen."
  - question: Welche Rolle spielt Kaja Schmidt-Tychsen bei Die jungen Ärzte?
    answer: "Sie spielt Alexandra «Alex» Jansson — eine ehemalige Rennfahrerin, die als Patientin ins Johannes-Thal-Klinikum kommt. Tough, direkt, mit keiner Geduld für Verzögerungen. Aus der anfänglichen Reibung mit Dr. Marc Lindner (Christian Beermann) entwickelt sich in Staffel 12 eine romantische Geschichte."
  - question: Wann war Kaja Schmidt-Tychsen das erste Mal bei Junge Ärzte zu sehen?
    answer: "Ihr erster Auftritt war in Folge 455 — der vorletzten Episode von Staffel 11 — am 16. April 2026 in der ARD Mediathek. Staffel 12, in der ihre Figur Alex Jansson eine zentrale Rolle einnimmt, startete am 30. April 2026 donnerstags um 18:50 Uhr im Ersten."
  - question: Ist Kaja Schmidt-Tychsen verheiratet?
    answer: "Ja. Kaja Schmidt-Tychsen heiratete ihren Partner Dirk im Jahr 2023 — die Hochzeit fand im kleinen Kreis statt. Aus ihrer ersten Ehe, die 2017 geschieden wurde, hat sie einen Sohn namens Ruwen. Ihr heutiges Privatleben hält sie weitgehend aus der Öffentlichkeit heraus."
  - question: Warum hat Kaja Schmidt-Tychsen «Alles was zählt» verlassen?
    answer: "Nach vierzehn Jahren verließ Kaja Schmidt-Tychsen die RTL-Soap im Juli 2025. Über die genauen Gründe äußerte sie sich nicht öffentlich. Fest steht: Der Wechsel zu «In aller Freundschaft – Die jungen Ärzte» in der ARD folgte kurze Zeit später — ein klares Signal für einen bewussten Neustart."
  - question: Welche anderen Serien hat Kaja Schmidt-Tychsen gespielt?
    answer: "Vor «Alles was zählt» war sie 2008 in der ZDF-Serie «Wege zum Glück» in einer Hauptrolle zu sehen. Daneben folgten Gastrollen in «Bettys Diagnose» (ZDF) und «SOKO Köln» (ZDF). Ihre Theaterlaufbahn führte sie ans Volkstheater Rostock und an das Staatstheater Schwerin."
takeaways:
  - "Kaja Schmidt-Tychsen bringt nach 14 Jahren AWZ als Ex-Rennfahrerin Alex Jansson frischen Wind in «Die jungen Ärzte» — und mischt das Liebesleben von Dr. Marc Lindner auf."
  - "Die ausgebildete Theaterschauspielerin aus Flensburg gewann bereits 2006 den Karl-Heinz-Walther-Preis und ist seit Staffel 12 (April 2026) die erste fest wiederkehrende Gastrolle der neuen Staffel."
  - "Privat lebt sie mit Ehemann Dirk (geheiratet 2023) und Sohn Ruwen — und hält ihr Familienleben bewusst aus dem Rampenlicht."
