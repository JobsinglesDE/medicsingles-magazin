intro: "Philipp Danne spielt seit 2015 den Assistenzarzt Dr. Ben Ahlbeck in «In aller Freundschaft – Die jungen Ärzte» — und gehört damit zu den beständigsten Gesichtern im deutschen Krankenhaus-TV. Der Kölner Schauspieler, 1985 geboren, ist seit 2017 mit Viktoria verheiratet und seit Herbst 2021 Vater eines Sohnes. Beruf, Pendeln und Familie: ein Alltag, den viele im Gesundheitswesen kennen."
