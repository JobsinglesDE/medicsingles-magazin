faqItems:
  - question: Wer ist Olivia Papoli-Barawati?
    answer: "Olivia Papoli-Barawati ist eine deutsche Schauspielerin, geboren 1995 in Osnabrück. Seit Februar 2024 spielt sie die Assistenzärztin Sofia Galura in der ARD-Serie «In aller Freundschaft – Die jungen Ärzte». Vor ihrer TV-Karriere stand sie vor allem auf Musical- und Theaterbühnen."
  - question: Welche Rolle spielt Olivia Papoli-Barawati in Die jungen Ärzte?
    answer: "Sie spielt Sofia Galura. Die Figur begann als Studentin im Praktischen Jahr und stieg mit Folge 383 nach bestandenem Staatsexamen zur Assistenzärztin in der Chirurgie auf. In Staffel 12 rückt Sofia Galura stärker ins Zentrum der Handlung."
  - question: Wie alt ist Olivia Papoli-Barawati und woher kommt sie?
    answer: "Olivia Papoli-Barawati wurde 1995 in Osnabrück geboren und ist damit Stand Mai 2026 rund 30 Jahre alt. Heute lebt sie in Berlin."
  - question: Welche Ausbildung hat Olivia Papoli-Barawati?
    answer: "Sie besuchte von 2012 bis 2014 das Tanzgymnasium Essen-Werden und absolvierte von 2014 bis 2017 eine Musical-Ausbildung an der Joop van den Ende Academy in Hamburg. 2019 folgte ein Film- und Kameraseminar bei Teresa Harder in Berlin."
  - question: Ist Olivia Papoli-Barawati in einer Beziehung?
    answer: "Über ihr Privatleben, eine Beziehung oder Familie macht Olivia Papoli-Barawati öffentlich keine Angaben. Auf Instagram (@olivia_papoli_barawati) zeigt sie vor allem Backstage-Eindrücke, Theaterproben und Reisefotos."
takeaways:
  - "Olivia Papoli-Barawati ist Jahrgang 1995 aus Osnabrück und kommt vom Musical, nicht vom klassischen Schauspiel."
  - "Sie spielt Sofia Galura seit Februar 2024 — erst als PJ-Studentin, seit Folge 383 als Assistenzärztin der Chirurgie."
  - "Privat bleibt sie zurückhaltend: Beziehung und Familie hält sie konsequent aus der Öffentlichkeit heraus."
