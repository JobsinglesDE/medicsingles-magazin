intro: "Kim Raver verkörpert seit Staffel 6 von «Grey's Anatomy» die Herzchirurgin Dr. Teddy Altman — eine der vielschichtigsten Figuren der Serie. Die New Yorkerin ist außerdem als Audrey Raines aus «24» bekannt und stand für «Lipstick Jungle» vor der Kamera. Mit Staffel 22 verabschiedete sie sich aus dem Grey Sloan Memorial Hospital."
