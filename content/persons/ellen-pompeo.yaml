intro: "Ellen Pompeo ist seit 2005 das Gesicht von «Grey's Anatomy» — als Dr. Meredith Grey wurde sie zur bekanntesten Serien-Ärztin der Welt. Seit Staffel 19 tritt sie kürzer, bleibt der Serie als Erzählerin und Produzentin aber treu. Privat lebt die US-Schauspielerin seit über zwei Jahrzehnten mit Musikproduzent Chris Ivery zusammen."
