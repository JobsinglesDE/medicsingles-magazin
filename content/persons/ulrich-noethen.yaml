faqItems:
  - question: Wer ist Ulrich Noethen?
    answer: "Ulrich Noethen ist ein deutscher Schauspieler, geboren am 11. Oktober 1959 in München. Er wurde einem breiten Publikum bekannt durch die Titelrolle in «Comedian Harmonists» (1997) und durch die Darstellung von Heinrich Himmler in «Der Untergang» (2004). In der ARD-Serie «Charité» spielt er in Staffel 2 den berühmten Chirurgen Prof. Ferdinand Sauerbruch."
  - question: Welche Rolle spielt Ulrich Noethen in «Charité» Staffel 2?
    answer: "Ulrich Noethen spielt in «Charité» Staffel 2 den historisch verbürgten Chirurgen Prof. Ferdinand Sauerbruch. Die Staffel spielt im Jahr 1943 an der Berliner Charité und zeigt Sauerbruch als ambivalente Figur: ein brillanter Mediziner, der im Zweiten Weltkrieg operiert und um seine Prinzipien kämpft. Noethen erhielt für diese Darstellung breites Kritikerlob."
  - question: Was sind die bekanntesten Filme von Ulrich Noethen?
    answer: "Zu den bekanntesten Filmen von Ulrich Noethen zählen «Comedian Harmonists» (1997), wo er das Leben des jüdischen Sängers Harry Frommermann verkörpert, sowie «Der Untergang» (2004) mit seiner beklemmenden Darstellung von SS-Reichsführer Heinrich Himmler. Weitere bekannte Rollen finden sich in «Der Tunnel» (2001) und zahlreichen deutschen TV-Produktionen."
  - question: Hat Ulrich Noethen Auszeichnungen gewonnen?
    answer: "Ja. Ulrich Noethen erhielt für seine Rolle in «Comedian Harmonists» 1998 den Deutschen Filmpreis (Lola) in Silber als bester Hauptdarsteller. Er wurde außerdem mit dem Bayerischen Filmpreis und dem Adolf-Grimme-Preis ausgezeichnet. Sein breites Repertoire — von historischen Dramen bis zu Komödien — hat ihm eine der renommiertesten Karrieren im deutschsprachigen Film eingebracht."
  - question: Wie alt ist Ulrich Noethen?
    answer: "Ulrich Noethen wurde am 11. Oktober 1959 in München geboren. Er ist damit im Jahr 2026 66 Jahre alt. Trotz seines Alters ist er weiterhin aktiv in Film und Fernsehen tätig und zählt zu den meistbeschäftigten deutschen Charakterdarstellern seiner Generation."
takeaways:
  - "Ulrich Noethen ist einer der vielseitigsten deutschen Schauspieler seiner Generation — von der jüdischen Sängerfigur in «Comedian Harmonists» bis zum berühmten Chirurgen Sauerbruch in «Charité» deckt er ein Spektrum ab, das nur wenige Kollegen erreichen."
  - "In «Charité» Staffel 2 (ARD, 2019) spielt er den historisch verbürgten Prof. Ferdinand Sauerbruch im Jahr 1943 — eine Rolle, die Noethen mit großer physischer und moralischer Tiefe ausfüllt und die Serie zu einem der wichtigsten deutschen Fernsehereignisse der letzten Jahre macht."
  - "Sein Privatleben hält Noethen konsequent aus der Öffentlichkeit — keine Paparazzi-Momente, keine Boulevard-Geschichten. Wer ihn kennen will, lernt ihn durch seine Figuren."
