intro: "Patrick Kalupa ist seit 2023 das Gesicht von «Dr. Nice» im ZDF — als Chirurg Dr. Moritz Neiss spielt er einen brillanten Arzt mit Ecken und Kanten, dem sein Ruf als netter Kerl manchmal selbst zu schaffen macht. Der Berliner Schauspieler wurde einem breiten Publikum bereits durch die Sat.1-Telenovela «Anna und die Liebe» und die Actionserie «Alarm für Cobra 11» bekannt. Privat ist er seit 2019 mit Schauspielerin Leonie Parusel verheiratet."
