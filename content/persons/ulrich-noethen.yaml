intro: "Ulrich Noethen verkörpert in Staffel 2 der ARD-Erfolgsserie «Charité» den legendären Chirurgen Prof. Ferdinand Sauerbruch — eine der anspruchsvollsten historischen Rollen im deutschen Fernsehen. Der 1959 in München geborene Schauspieler zählt seit den 1990er-Jahren zu den prägenden Gesichtern des deutschsprachigen Kinos, mit Auszeichnungen vom Deutschen Filmpreis bis zum Bayerischen Fernsehpreis. Privat lebt er zurückgezogen — eine Haltung, die ihn als Person so rätselhaft macht wie viele seiner Figuren."
