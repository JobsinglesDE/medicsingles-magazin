faqItems:
  - question: Wen spielt Uwe Ochsenknecht in der Charité?
    answer: "In «Charité» Staffel 3 (2021) verkörpert Uwe Ochsenknecht den Chirurgieprofessor Prof. Helmut Kraatz. Die Handlung der dritten Staffel ist im Jahr 1961 angesiedelt — kurz vor dem Mauerbau in Berlin."
  - question: Wie alt ist Uwe Ochsenknecht?
    answer: "Uwe Ochsenknecht wurde am 30. Januar 1952 in Biblis, Hessen geboren. Er ist damit Jahrgang 1952 und im Jahr 2026 bereits 74 Jahre alt — und nach wie vor aktiv als Schauspieler."
  - question: Welche bekannten Kinder hat Uwe Ochsenknecht?
    answer: "Uwe Ochsenknecht hat zwei Söhne, die ebenfalls Schauspieler wurden: Wilson Gonzalez Ochsenknecht (geboren 1990) und Jimi Blue Ochsenknecht (geboren 1992). Beide wurden durch Serienrollen und Kinofilme bekannt. Außerdem hat er eine Tochter, Cheyenne Savannah Ochsenknecht (geboren 1995)."
  - question: Was sind die bekanntesten Filme von Uwe Ochsenknecht?
    answer: "Zu seinen bekanntesten Werken zählen «Das Boot» (1981, Regie: Wolfgang Petersen), «Schtonk!» (1992, für den er den Bayerischen Filmpreis gewann) und die Komödie «Männerpension» (1995). Daneben war er in zahlreichen TV-Produktionen wie «Der Landarzt» oder «Tatort» zu sehen."
  - question: Macht Uwe Ochsenknecht auch Musik?
    answer: "Ja. Uwe Ochsenknecht ist seit den 1980er-Jahren auch als Rockmusiker aktiv. Er trat mit verschiedenen Bands auf und veröffentlichte eigene Alben, unter anderem mit dem Projekt «Uwe Ochsenknecht & Die Stiefväter». Musik ist für ihn neben der Schauspielerei eine konstante Leidenschaft."
takeaways:
  - "Uwe Ochsenknecht ist seit über vier Jahrzehnten eine der prägenden Figuren des deutschen Kinos — von «Das Boot» bis «Charité» reicht sein Bogen."
  - "Als Prof. Helmut Kraatz in «Charité» Staffel 3 bringt er die moralischen Graubereiche der Medizin im geteilten Berlin des Jahres 1961 eindringlich auf den Punkt."
  - "Privat ist er Vater einer Schauspielerfamilie: Seine Söhne Wilson Gonzalez und Jimi Blue Ochsenknecht haben beide in seine Fußstapfen getreten."
