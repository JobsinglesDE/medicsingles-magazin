intro: "Emilia Schüle ist eine der vielseitigsten deutschen Schauspielerinnen ihrer Generation. Als Hedwig Freiberg — spätere Frau von Robert Koch — stand sie in der ARD-Serie «Charité» vor der Kamera und überzeugte das Publikum mit viel Feingefühl für die Figur einer Frau im wilhelminischen Berlin. Danach folgte eine internationale Karriere: In der Canal+-Serie «Marie Antoinette» verkörpert sie die berühmteste Königin Frankreichs auf Englisch, Deutsch und Französisch."
