faqItems:
  - question: Wer ist Anne Fleck und was macht sie bekannt?
    answer: "Anne Fleck ist eine deutsche Internistin, Rheumatologin und Ernährungsmedizinerin mit Privatpraxis in Hamburg-Nienstedten. Bekannt wurde sie als Doc Fleck durch die NDR-Reihe «Die Ernährungs-Docs», in der sie seit dem Sendestart 2014 neben Matthias Riedl und Jörn Klasen Patienten mit Ernährungstherapie behandelt. Hinzu kommen mehrere SPIEGEL-Bestseller und eine wöchentliche Gesundheitsrubrik bei RTL."
  - question: Welche Bücher hat Anne Fleck geschrieben?
    answer: "Die bekanntesten Anne Fleck Bücher sind der SPIEGEL-Bestseller «Ran an das Fett» (Rowohlt 2019) und «Energy! Der gesunde Weg aus dem Müdigkeitslabyrinth» (dtv 2021). Dazu kommen die SCHLANK!-Reihe (BJV 2017/2018) und mehrere gemeinsame Kochbücher der Ernährungs-Docs im ZS Verlag, die 2016 bis 2019 viermal in Folge von der Gastronomischen Akademie Deutschlands ausgezeichnet wurden."
  - question: Was ist die Doc Fleck Methode?
    answer: "Die Doc Fleck Methode ist ein integratives, präventiv ausgerichtetes Konzept aus Ernährung, Mikronährstoffmedizin, Bewegung, Schlaf und Stressregulation. Sie fragt nach langfristigen Ursachen statt isolierter Symptombehandlung. Es handelt sich um ein persönliches Konzept Flecks — keinen geschützten Leitlinien-Begriff. Teile der Empfehlungen werden in der wissenschaftsorientierten Fachwelt kritisch als nicht durchgängig evidenzbasiert diskutiert."
  - question: Welchen Podcast betreibt Anne Fleck?
    answer: "Anne Fleck ist Co-Hosterin des Podcasts «Dr. Anne Fleck — Gesundheit und Ernährung», produziert von RTL+ und Audio Alliance. Im Gespräch mit Redakteurin Kirsten Frintrop bespricht sie Longevity, Ernährung und Alltagsroutinen. Neue Folgen erscheinen wöchentlich und sind auf Spotify, Apple Podcasts und der ARD Audiothek verfügbar."
  - question: Wo praktiziert Anne Fleck?
    answer: "Anne Fleck führt eine Privatpraxis in Hamburg-Nienstedten mit Schwerpunkt Präventions- und Ernährungsmedizin. Zuvor hat sie nach eigenen Angaben Zentren für Präventiv- und Ernährungsmedizin sowie für Adipositas-Behandlung aufgebaut und geleitet. Genaue Praxisadresse und Honorarstrukturen werden nicht öffentlich kommuniziert."
takeaways:
  - "Anne Fleck ist Internistin, Rheumatologin und Ernährungsmedizinerin — als Doc Fleck eine der bekanntesten Stimmen der deutschen Präventionsmedizin."
  - "Seit dem Sendestart 2014 gehört sie zum festen Trio der NDR-Ernährungs-Docs; seit Mai 2022 hat sie zudem eine wöchentliche Rubrik bei RTL Punkt 12."
  - "Ihr SPIEGEL-Bestseller «Ran an das Fett» (2019) und «Energy!» (2021) zeigen, wie konsequente Nischenpositionierung über Jahre eine eigene Marke aufbaut."
